          package com.cine.launcher

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class Look {
              var radius = 18
              var scale = 1.13f
              var sheen = true
              var labels = 0
              var anim = true
          }

          class Opt(val key: String, val title: String, val choices: List<String>, val def: Int)

          val OPTS = listOf(
              Opt("accent", "Glow color", listOf("Auto", "Blue", "Purple", "Red", "Green", "Orange", "Pink", "Teal"), 0),
              Opt("bg", "Background", listOf("Aurora", "Dark", "Black"), 0),
              Opt("layout", "Layout", listOf("Top row + apps", "Two rows", "Single row"), 0),
              Opt("toprow", "Top row shows", listOf("Recommended", "Recent apps", "Off"), 0),
              Opt("rtype", "Recommend", listOf("Movies + shows", "Movies", "Shows"), 0),
              Opt("minr", "Minimum rating", listOf("7.5", "8.0", "8.5"), 1),
              Opt("stats", "System tile", listOf("Show", "Hide"), 0),
              Opt("moctale", "Moctale tile", listOf("Show", "Hide"), 0),
              Opt("size", "Card size", listOf("Small", "Medium", "Large"), 1),
              Opt("count", "Apps in big row", listOf("4", "6", "8", "10", "12"), 2),
              Opt("corner", "Corners", listOf("Square", "Rounded", "Round"), 1),
              Opt("focus", "Focus zoom", listOf("Subtle", "Normal", "Big"), 1),
              Opt("sheen", "Focus shine", listOf("On", "Off"), 0),
              Opt("labels", "App names", listOf("On focus", "Always", "Hidden"), 0),
              Opt("sort", "Sort apps", listOf("A to Z", "Z to A"), 0),
              Opt("clock", "Clock", listOf("Show", "Hide"), 0),
              Opt("greet", "Greeting", listOf("Show", "Hide"), 0),
              Opt("anim", "Animations", listOf("On", "Off"), 0)
          )

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("cine", Context.MODE_PRIVATE)

              var cur: String
                  get() = sp.getString("cur", "p1") ?: "p1"
                  set(v) { sp.edit().putString("cur", v).apply() }

              fun profiles(): JSONArray {
                  val s = sp.getString("profiles", null)
                  if (s == null) {
                      val a = JSONArray().put(JSONObject().put("id", "p1").put("name", "Me").put("email", ""))
                      saveProfiles(a)
                      return a
                  }
                  return JSONArray(s)
              }

              fun saveProfiles(a: JSONArray) { sp.edit().putString("profiles", a.toString()).apply() }

              fun profile(): JSONObject {
                  val a = profiles()
                  for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == cur) return a.getJSONObject(i)
                  return a.getJSONObject(0)
              }

              fun update(f: (JSONObject) -> Unit) {
                  val id = profile().getString("id")
                  val a = profiles()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") == id) f(o)
                  }
                  saveProfiles(a)
              }

              fun addProfile(name: String) {
                  val a = profiles()
                  val id = "p" + System.currentTimeMillis()
                  a.put(JSONObject().put("id", id).put("name", name).put("email", ""))
                  saveProfiles(a)
                  cur = id
              }

              fun deleteCurrent() {
                  val a = profiles()
                  if (a.length() < 2) return
                  val id = profile().getString("id")
                  val n = JSONArray()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") != id) n.put(o)
                  }
                  saveProfiles(n)
                  cur = n.getJSONObject(0).getString("id")
              }

              fun get(k: String, d: String): String = sp.getString(profile().getString("id") + "." + k, d) ?: d
              fun put(k: String, v: String) { sp.edit().putString(profile().getString("id") + "." + k, v).apply() }
              fun gget(k: String): String = sp.getString("g." + k, "") ?: ""
              fun gput(k: String, v: String) { sp.edit().putString("g." + k, v).apply() }
              fun list(k: String): List<String> = get(k, "").split(",").filter { it.isNotEmpty() }

              fun sel(key: String): Int {
                  val o = OPTS.first { it.key == key }
                  return (get(key, o.def.toString()).toIntOrNull() ?: o.def).coerceIn(0, o.choices.size - 1)
              }
          }
