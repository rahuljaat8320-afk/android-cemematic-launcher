              private fun wifiOn(): Boolean = try {
                  (applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager).isWifiEnabled
              } catch (e: Exception) { false }

              private fun btOn(): Boolean = try { BluetoothAdapter.getDefaultAdapter()?.isEnabled == true } catch (e: Exception) { false }

              private fun refreshToggles() {
                  setStatus(wifiPill, "Wi-Fi", wifiOn())
                  setStatus(btPill, "Bluetooth", btOn())
              }

              private fun toggleWifi() {
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION")
                      val ok = wm.setWifiEnabled(!wm.isWifiEnabled)
                      if (!ok) sys(Settings.ACTION_WIFI_SETTINGS)
                  } catch (e: Exception) { sys(Settings.ACTION_WIFI_SETTINGS) }
                  handler.postDelayed({ refreshToggles() }, 1500)
              }

              private fun toggleBt() {
                  try {
                      if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 5)
                          return
                      }
                      val a = BluetoothAdapter.getDefaultAdapter()
                      if (a == null) { toast("No Bluetooth on this TV"); return }
                      @Suppress("DEPRECATION")
                      val ok = if (a.isEnabled) a.disable() else a.enable()
                      if (!ok) sys(Settings.ACTION_BLUETOOTH_SETTINGS)
                  } catch (e: Exception) { sys(Settings.ACTION_BLUETOOTH_SETTINGS) }
                  handler.postDelayed({ refreshToggles() }, 1500)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  refreshToggles()
              }

