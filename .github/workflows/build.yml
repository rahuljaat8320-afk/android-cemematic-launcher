          package com.cine.launcher

          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import android.content.res.Resources
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffColorFilter
          import android.graphics.RectF
          import android.graphics.drawable.AdaptiveIconDrawable
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import android.os.Build
          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser

          /** Reads a normal Android icon-pack app (ADW / Nova / Apex / Go style: it ships an appfilter.xml). */
          class IconPack(private val pm: PackageManager, val pkg: String) {
              private val map = HashMap<String, String>()
              private var res: Resources? = null

              fun load(): Boolean {
                  try {
                      val r = pm.getResourcesForApplication(pkg)
                      res = r
                      var parser: XmlPullParser? = null
                      val id = r.getIdentifier("appfilter", "xml", pkg)
                      if (id != 0) parser = r.getXml(id)
                      else {
                          try {
                              val p = Xml.newPullParser()
                              p.setInput(r.assets.open("appfilter.xml"), "utf-8")
                              parser = p
                          } catch (e: Exception) { }
                      }
                      if (parser == null) return false
                      var ev = parser.eventType
                      while (ev != XmlPullParser.END_DOCUMENT) {
                          if (ev == XmlPullParser.START_TAG && parser.name == "item") {
                              val comp = parser.getAttributeValue(null, "component")
                              val dr = parser.getAttributeValue(null, "drawable")
                              if (comp != null && dr != null && comp.contains("{") && comp.contains("/")) {
                                  val key = comp.substringAfter("{").substringBefore("}")
                                  if (!map.containsKey(key)) map[key] = dr
                              }
                          }
                          ev = parser.next()
                      }
                  } catch (e: Exception) { return false }
                  return map.isNotEmpty()
              }

              fun get(cn: ComponentName): Drawable? {
                  val r = res ?: return null
                  val name = map[cn.packageName + "/" + cn.className] ?: return null
                  return try {
                      var id = r.getIdentifier(name, "drawable", pkg)
                      if (id == 0) id = r.getIdentifier(name, "mipmap", pkg)
                      if (id == 0) null else r.getDrawable(id, null)
                  } catch (e: Exception) { null }
              }
          }

          object Icons {
              val CREAM: Int = 0xFFEDE8DF.toInt()

              private fun toBitmap(d: Drawable, size: Int): Bitmap {
                  val b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, size, size)
                  d.draw(Canvas(b))
                  return b
              }

              // An adaptive icon is a 108x108 canvas of which the centre 72x72 is shown: draw it big and keep the centre.
              private fun cropCentre(draw: (Canvas, Int) -> Unit, size: Int): Bitmap {
                  val big = size * 3 / 2
                  val b = Bitmap.createBitmap(big, big, Bitmap.Config.ARGB_8888)
                  draw(Canvas(b), big)
                  val o = (big - size) / 2
                  return Bitmap.createBitmap(b, o, o, size, size)
              }

              private fun tint(b: Bitmap): Bitmap {
                  val o = Bitmap.createBitmap(b.width, b.height, Bitmap.Config.ARGB_8888)
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  p.colorFilter = PorterDuffColorFilter(CREAM, PorterDuff.Mode.SRC_IN)
                  Canvas(o).drawBitmap(b, 0f, 0f, p)
                  return o
              }

              /**
               * Turns any app icon into a single-colour (cream) logo, like the glass-bar reference.
               * 1. Android 13 "themed icon" layer when the app has one.
               * 2. Otherwise the icon's background colour is removed and only the logo shape is kept.
               */
              fun mono(ctx: Context, src: Drawable, size: Int = 160): Drawable {
                  try {
                      if (Build.VERSION.SDK_INT >= 33 && src is AdaptiveIconDrawable) {
                          val m = src.monochrome
                          if (m != null) {
                              val bmp = cropCentre({ c, s -> m.setBounds(0, 0, s, s); m.draw(c) }, size)
                              return BitmapDrawable(ctx.resources, tint(bmp))
                          }
                      }
                      val bmp: Bitmap = if (Build.VERSION.SDK_INT >= 26 && src is AdaptiveIconDrawable) {
                          cropCentre({ c, s ->
                              src.background?.let { it.setBounds(0, 0, s, s); it.draw(c) }
                              src.foreground?.let { it.setBounds(0, 0, s, s); it.draw(c) }
                          }, size)
                      } else toBitmap(src, size)
                      return BitmapDrawable(ctx.resources, cutout(bmp))
                  } catch (e: Exception) { return src }
              }

              private fun cutout(b: Bitmap): Bitmap {
                  val w = b.width
                  val h = b.height
                  val px = IntArray(w * h)
                  b.getPixels(px, 0, w, 0, 0, w, h)
                  // sample the background near the four corners (a bit inside, so rounded icon corners don't fool us)
                  val ins = (w * 0.1f).toInt().coerceAtLeast(1)
                  val pts = intArrayOf(ins, ins, w - 1 - ins, ins, ins, h - 1 - ins, w - 1 - ins, h - 1 - ins)
                  var ar = 0; var ag = 0; var ab = 0; var aa = 0
                  for (k in 0 until 4) {
                      val p = px[pts[k * 2 + 1] * w + pts[k * 2]]
                      aa += (p ushr 24) and 255; ar += (p shr 16) and 255; ag += (p shr 8) and 255; ab += p and 255
                  }
                  aa /= 4; ar /= 4; ag /= 4; ab /= 4
                  val solidBg = aa > 200
                  val rgb = CREAM and 0x00FFFFFF
                  for (i in px.indices) {
                      val p = px[i]
                      val pa = (p ushr 24) and 255
                      val a: Int
                      if (!solidBg) a = pa
                      else {
                          val dr = Math.abs(((p shr 16) and 255) - ar)
                          val dg = Math.abs(((p shr 8) and 255) - ag)
                          val db = Math.abs((p and 255) - ab)
                          val dist = maxOf(dr, maxOf(dg, db))
                          a = (((dist - 40) * 255 / 100).coerceIn(0, 255)) * pa / 255
                      }
                      px[i] = (a shl 24) or rgb
                  }
                  val o = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  o.setPixels(px, 0, w, 0, 0, w, h)
                  return o
              }

              /** shape 0 = round badge, 1 = squircle badge */
              fun badge(ctx: Context, src: Drawable, shape: Int): Drawable {
                  try {
                      val s = 160
                      val b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                      val c = Canvas(b)
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)
                      p.color = 0xFF232B3D.toInt()
                      if (shape == 0) c.drawCircle(s / 2f, s / 2f, s / 2f, p)
                      else c.drawRoundRect(RectF(0f, 0f, s.toFloat(), s.toFloat()), s * 0.28f, s * 0.28f, p)
                      val ic = toBitmap(src, s)
                      val inset = s * 0.18f
                      c.drawBitmap(ic, null, RectF(inset, inset, s - inset, s - inset), Paint(Paint.FILTER_BITMAP_FLAG))
                      return BitmapDrawable(ctx.resources, b)
                  } catch (e: Exception) { return src }
              }
          }
