          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.graphics.drawable.StateListDrawable
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.media.tv.TvContract
          import android.media.tv.TvInputManager
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.TextUtils
          import android.text.format.DateFormat
          import android.text.style.ForegroundColorSpan
          import android.util.StateSet
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Collections
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors

          class RecRaw(val id: Int, val mt: String, val title: String, val rating: Double, val img: String, val badge: String)

          class MI(val label: String, val value: (() -> String)? = null, val keep: Boolean = false, val run: () -> Unit)

          class MainActivity : Activity() {

              private lateinit var store: Store
              private val look = Look()
              private lateinit var root: FrameLayout
              private lateinit var content: FrameLayout
              private var overlay: View? = null
              private var focusBefore: View? = null

              private lateinit var clock: TextView
              private lateinit var date: TextView
              private lateinit var greeting: TextView
              private lateinit var heroBox: View
              private lateinit var chipAvatar: TextView
              private lateinit var chipName: TextView
              private lateinit var chipMail: TextView
              private lateinit var wifiPill: TextView
              private lateinit var btPill: TextView
              private lateinit var rowR: RecyclerView
              private lateinit var row1: RecyclerView
              private lateinit var row2: RecyclerView
              private lateinit var aR: AppAdapter
              private lateinit var a1: AppAdapter
              private lateinit var a2: AppAdapter
              private lateinit var glowA: GradientDrawable
              private lateinit var glowB: GradientDrawable
              private lateinit var baseBg: ColorDrawable
              private lateinit var statsBox: LinearLayout
              private lateinit var detBox: LinearLayout
              private lateinit var detTitle: TextView
              private lateinit var detMeta: TextView
              private lateinit var detOver: TextView
              private lateinit var cpuTv: TextView
              private lateinit var cpuBar: ProgressBar
              private lateinit var ramTv: TextView
              private lateinit var ramBar: ProgressBar
              private lateinit var gpuTv: TextView
              private lateinit var gpuBar: ProgressBar
              private var recs: List<AppItem> = emptyList()
              private var recState = 0
              private var recTime = 0L
              private var focusPending = true
              private var prevTotal = 0L
              private var prevIdle = 0L
              private var cpuApprox = false
              private var gpuApprox = false
              private val net = Executors.newSingleThreadExecutor()
              private val statsTick = object : Runnable { override fun run() { updateStats(); handler.postDelayed(this, 2000) } }
              private val carousel = object : Runnable { override fun run() { advanceRecs(); handler.postDelayed(this, 6000) } }
              private val moctale by lazy {
                  AppItem("Moctale · Indian movie picks", "rec:moctale",
                      Intent(Intent.ACTION_VIEW, Uri.parse("https://moctale.in")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      textTile("Moctale", 0xFF6D28D9.toInt()), true, 0xFF6D28D9.toInt(), false, "OPEN SITE",
                      "Moctale  ·  Indian movie and series community",
                      "India-focused reviews, clubs and watchlists, with its own Moctale Meter (Skip, Time Pass, Go for It, Perfection). Press OK to open moctale.in.")
              }

              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val defaultTint = 0xFF3B4CCA.toInt()
              private val accents = arrayOf<Int?>(
                  null, 0xFF3B82F6.toInt(), 0xFF8B5CF6.toInt(), 0xFFEF4444.toInt(),
                  0xFF22C55E.toInt(), 0xFFF59E0B.toInt(), 0xFFEC4899.toInt(), 0xFF14B8A6.toInt()
              )
              private val avatarColors = intArrayOf(0xFF3B4CCA.toInt(), 0xFF0F9D7A.toInt(), 0xFFD9480F.toInt(), 0xFF9C36B5.toInt(), 0xFFC2255C.toInt())
              private var curTint = defaultTint
              private var bgMode = 0
              private var tintAnim: ValueAnimator? = null
              private var master: List<AppItem> = emptyList()
              private var shown: List<AppItem> = emptyList()
              private var splitFirst: AppItem? = null

              private val tick = object : Runnable {
                  override fun run() { updateTime(); refreshToggles(); handler.postDelayed(this, 15_000) }
              }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { loadApps() }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(m: String) { Toast.makeText(this, m, Toast.LENGTH_SHORT).show() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = Store(this)
                  val dm = resources.displayMetrics
                  fun glow(cx: Float, cy: Float, r: Float) = GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      setGradientCenter(cx, cy)
                      gradientRadius = r
                  }
                  glowA = glow(0.18f, 0.05f, dm.widthPixels * 0.8f)
                  glowB = glow(0.95f, 0.6f, dm.widthPixels * 0.6f)
                  baseBg = ColorDrawable(0xFF05060B.toInt())
                  root = FrameLayout(this).apply { background = LayerDrawable(arrayOf(baseBg, glowA, glowB)) }
                  content = FrameLayout(this).apply { clipChildren = false }
                  root.addView(content, FrameLayout.LayoutParams(-1, -1))
                  buildTop()
                  buildHero()
                  buildRows()
                  setContentView(root)
                  applyLook()
              }

              // ---------- UI building ----------
              private fun pillBg(r: Int) = StateListDrawable().apply {
                  addState(intArrayOf(android.R.attr.state_focused), GradientDrawable().apply { setColor(0x66FFFFFF); cornerRadius = dp(r).toFloat() })
                  addState(StateSet.WILD_CARD, GradientDrawable().apply { setColor(0x22FFFFFF); cornerRadius = dp(r).toFloat() })
              }

              private fun zoomOnFocus(v: View) {
                  v.setOnFocusChangeListener { view, f -> view.animate().scaleX(if (f) 1.08f else 1f).scaleY(if (f) 1.08f else 1f).setDuration(120).start() }
              }

              private fun pill(label: String, onLong: (() -> Unit)? = null, click: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.setTextColor(Color.WHITE)
                  t.textSize = 13f
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(14), dp(8), dp(14), dp(8))
                  t.isFocusable = true
                  t.background = pillBg(20)
                  zoomOnFocus(t)
                  t.setOnClickListener { click() }
                  if (onLong != null) t.setOnLongClickListener { onLong(); true }
                  return t
              }

              private fun buildTop() {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      clipChildren = false
                      setPadding(dp(64), dp(22), dp(64), 0)
                  }
                  val chip = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(6), dp(16), dp(6))
                      isFocusable = true
                      background = pillBg(30)
                  }
                  zoomOnFocus(chip)
                  chip.setOnClickListener { profileMenu() }
                  chipAvatar = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(defaultTint) }
                  }
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), 0, 0, 0) }
                  chipName = TextView(this).apply { setTextColor(Color.WHITE); textSize = 14f; typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL) }
                  chipMail = TextView(this).apply {
                      setTextColor(0x99FFFFFF.toInt()); textSize = 11f; maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END; maxWidth = dp(140)
                  }
                  col.addView(chipName); col.addView(chipMail)
                  chip.addView(chipAvatar, LinearLayout.LayoutParams(dp(36), dp(36)))
                  chip.addView(col)
                  bar.addView(chip)
                  bar.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))

                  wifiPill = pill("Wi-Fi") { toggleWifi() }
                  btPill = pill("Bluetooth") { toggleBt() }
                  val pills = listOf(
                      wifiPill, btPill,
                      pill("Audio", { pickSettingsPage("audio") }) { openShortcut("audio") },
                      pill("Video", { pickSettingsPage("video") }) { openShortcut("video") },
                      pill("Quick") { quickMenu() },
                      pill("Customize") { customize() }
                  )
                  for (p in pills) bar.addView(p, LinearLayout.LayoutParams(-2, -2).apply { marginStart = dp(8) })
                  content.addView(bar, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))
              }

              private fun buildHero() {
                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(64), dp(78), 0, 0)
                  }
                  clock = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 34f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(14), 0, 0, 0) }
                  greeting = TextView(this).apply { setTextColor(Color.WHITE); textSize = 15f; typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL) }
                  date = TextView(this).apply { setTextColor(0x99FFFFFF.toInt()); textSize = 13f }
                  col.addView(greeting); col.addView(date)
                  hero.addView(clock); hero.addView(col)
                  heroBox = hero
                  content.addView(hero, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START))

                  cpuTv = statTv(); ramTv = statTv(); gpuTv = statTv()
                  cpuBar = statBar(0xFF60A5FA.toInt()); ramBar = statBar(0xFFA78BFA.toInt()); gpuBar = statBar(0xFF34D399.toInt())
                  statsBox = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      background = GradientDrawable().apply { setColor(0x26FFFFFF); cornerRadius = dp(12).toFloat() }
                  }
                  statsBox.addView(statCol(cpuTv, cpuBar)); statsBox.addView(statCol(ramTv, ramBar)); statsBox.addView(statCol(gpuTv, gpuBar))
                  content.addView(statsBox, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply { topMargin = dp(74); marginEnd = dp(64) })

                  detTitle = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 18f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  }
                  detMeta = TextView(this).apply { setTextColor(0xFF9DB4FF.toInt()); textSize = 12f; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                  detOver = TextView(this).apply { setTextColor(0xCCFFFFFF.toInt()); textSize = 11f; maxLines = 2; ellipsize = TextUtils.TruncateAt.END }
                  detBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE }
                  detBox.addView(detTitle); detBox.addView(detMeta); detBox.addView(detOver)
                  val detW = resources.displayMetrics.widthPixels - dp(64) - dp(360)
                  content.addView(detBox, FrameLayout.LayoutParams(detW, -2, Gravity.TOP or Gravity.START).apply { topMargin = dp(76); marginStart = dp(64) })
              }

              private fun buildRows() {
                  val onFocus: (AppItem) -> Unit = { app -> applyTint(accents[store.sel("accent")] ?: app.tint ?: defaultTint); showDetails(app) }
                  val onOpen: (AppItem) -> Unit = { app -> openApp(app) }
                  val onMenu: (AppItem) -> Unit = { app -> appMenu(app) }
                  aR = AppAdapter(look, onFocus, onOpen, onMenu)
                  a1 = AppAdapter(look, onFocus, onOpen, onMenu)
                  a2 = AppAdapter(look, onFocus, onOpen, onMenu)
                  fun rowOf(a: AppAdapter) = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity, RecyclerView.HORIZONTAL, false)
                      adapter = a
                      clipToPadding = false
                      clipChildren = false
                      setPadding(dp(64), dp(14), dp(64), dp(14))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      itemAnimator = null
                  }
                  rowR = rowOf(aR); row1 = rowOf(a1); row2 = rowOf(a2)
                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      clipChildren = false
                      setPadding(0, 0, 0, dp(8))
                  }
                  bottom.addView(rowR, LinearLayout.LayoutParams(-1, -2))
                  bottom.addView(row1, LinearLayout.LayoutParams(-1, -2))
                  bottom.addView(row2, LinearLayout.LayoutParams(-1, -2))
                  content.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
              }

              // ---------- look & settings ----------
              private fun applyLook() {
                  look.radius = intArrayOf(4, 12, 22)[store.sel("corner")]
                  look.scale = floatArrayOf(1.06f, 1.13f, 1.22f)[store.sel("focus")]
                  look.sheen = store.sel("sheen") == 0
                  look.labels = store.sel("labels")
                  look.anim = store.sel("anim") == 0
                  val sz = store.sel("size")
                  val big = arrayOf(intArrayOf(176, 99), intArrayOf(208, 117), intArrayOf(248, 140))[sz]
                  val small = arrayOf(intArrayOf(132, 74), intArrayOf(156, 88), intArrayOf(188, 106))[sz]
                  aR.cw = small[0]; aR.ch = small[1]
                  a1.cw = big[0]; a1.ch = big[1]
                  a2.cw = small[0]; a2.ch = small[1]
                  for ((r, a) in listOf(rowR to aR, row1 to a1, row2 to a2)) { r.adapter = null; r.adapter = a }
                  heroBox.visibility = if (store.sel("clock") == 0) View.VISIBLE else View.GONE
                  greeting.visibility = if (store.sel("greet") == 0) View.VISIBLE else View.GONE
                  statsBox.visibility = if (store.sel("stats") == 0) View.VISIBLE else View.GONE
                  bgMode = store.sel("bg")
                  baseBg.color = if (bgMode == 2) Color.BLACK else 0xFF05060B.toInt()
                  val fixed = accents[store.sel("accent")]
                  if (fixed != null) applyTint(fixed) else paintGlow(curTint)
                  updateTime()
                  refreshProfile()
                  render()
              }

              private fun refreshProfile() {
                  val p = store.profile()
                  val name = p.getString("name")
                  val mail = p.optString("email")
                  chipAvatar.text = name.take(1).uppercase()
                  (chipAvatar.background as GradientDrawable).setColor(avatarColors[Math.abs(p.getString("id").hashCode()) % avatarColors.size])
                  chipName.text = name
                  chipMail.text = if (mail.isEmpty()) "No account linked" else mail
              }

              private fun paintGlow(c: Int) {
                  if (bgMode != 0) {
                      glowA.colors = intArrayOf(0, 0); glowB.colors = intArrayOf(0, 0)
                      return
                  }
                  glowA.colors = intArrayOf((c and 0x00FFFFFF) or 0x77000000, 0x00000000)
                  val hsv = FloatArray(3)
                  Color.colorToHSV(c, hsv)
                  hsv[0] = (hsv[0] + 50f) % 360f
                  glowB.colors = intArrayOf((Color.HSVToColor(hsv) and 0x00FFFFFF) or 0x55000000, 0x00000000)
              }

              private fun applyTint(target: Int) {
                  tintAnim?.cancel()
                  if (!look.anim) { curTint = target; paintGlow(target); return }
                  tintAnim = ValueAnimator.ofObject(ArgbEvaluator(), curTint, target).apply {
                      duration = 400
                      addUpdateListener { curTint = it.animatedValue as Int; paintGlow(curTint) }
                      start()
                  }
              }

              private fun tintOf(src: Drawable): Int? = try {
                  val dd = src.constantState?.newDrawable()?.mutate() ?: src
                  val bmp = Bitmap.createBitmap(12, 12, Bitmap.Config.ARGB_8888)
                  dd.setBounds(0, 0, 12, 12)
                  dd.draw(Canvas(bmp))
                  var r = 0.0; var g = 0.0; var b = 0.0; var wSum = 0.0
                  val hsv = FloatArray(3)
                  for (x in 0 until 12) for (y in 0 until 12) {
                      val px = bmp.getPixel(x, y)
                      if (Color.alpha(px) < 128) continue
                      Color.colorToHSV(px, hsv)
                      val w = (hsv[1] * hsv[2]).toDouble() + 0.001
                      r += Color.red(px) * w; g += Color.green(px) * w; b += Color.blue(px) * w; wSum += w
                  }
                  bmp.recycle()
                  if (wSum <= 0.0) null else {
                      val avg = Color.rgb((r / wSum).toInt(), (g / wSum).toInt(), (b / wSum).toInt())
                      Color.colorToHSV(avg, hsv)
                      if (hsv[1] < 0.2f) null else {
                          hsv[1] = hsv[1].coerceAtLeast(0.55f)
                          hsv[2] = hsv[2].coerceAtLeast(0.85f)
                          Color.HSVToColor(hsv)
                      }
                  }
              } catch (e: Exception) { null }

              // ---------- app list ----------
              private fun render() {
                  val hidden = store.list("hidden")
                  val rev = store.sel("sort") == 1
                  fun s(l: List<AppItem>) = if (rev) l.sortedByDescending { it.label.lowercase() } else l.sortedBy { it.label.lowercase() }
                  val vis = master.filter { it.pkg !in hidden }
                  var list = s(vis.filter { it.lean }) + s(vis.filter { !it.lean })
                  val ord = store.list("order")
                  if (ord.isNotEmpty()) list = list.sortedBy { val i = ord.indexOf(it.pkg); if (i < 0) Int.MAX_VALUE else i }
                  shown = list
                  val n = intArrayOf(4, 6, 8, 10, 12)[store.sel("count")]
                  when (store.sel("layout")) {
                      0 -> {
                          aR.items = when (store.sel("toprow")) {
                              0 -> recTiles()
                              1 -> store.list("recent").mapNotNull { p -> list.firstOrNull { it.pkg == p } }
                              else -> emptyList()
                          }
                          a1.items = list; a2.items = emptyList()
                      }
                      1 -> { aR.items = emptyList(); a1.items = list.take(n); a2.items = list.drop(n) }
                      else -> { aR.items = emptyList(); a1.items = list; a2.items = emptyList() }
                  }
                  aR.notifyDataSetChanged(); a1.notifyDataSetChanged(); a2.notifyDataSetChanged()
                  rowR.visibility = if (aR.items.isEmpty()) View.GONE else View.VISIBLE
                  row2.visibility = if (a2.items.isEmpty()) View.GONE else View.VISIBLE
                  if (overlay == null) row1.post {
                      if (focusPending || currentFocus == null) { if (row1.getChildAt(0)?.requestFocus() == true) focusPending = false }
                  }
              }

              private fun loadApps() {
                  io.execute {
                      val pm = packageManager
                      val seen = HashSet<String>()
                      val result = ArrayList<AppItem>()
                      fun add(cat: String, lean: Boolean) {
                          val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                              .filter { it.activityInfo.packageName != packageName }
                          for (ri in apps) {
                              val pkg = ri.activityInfo.packageName
                              if (!seen.add(pkg)) continue
                              val banner = ri.activityInfo.loadBanner(pm) ?: ri.activityInfo.applicationInfo.loadBanner(pm)
                              val img = banner ?: ri.loadIcon(pm)
                              val intent = Intent(Intent.ACTION_MAIN)
                                  .setClassName(pkg, ri.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              result.add(AppItem(ri.loadLabel(pm).toString(), pkg, intent, img, banner != null, tintOf(img), lean))
                          }
                      }
                      add(Intent.CATEGORY_LEANBACK_LAUNCHER, true)
                      add(Intent.CATEGORY_LAUNCHER, false)
                      runOnUiThread { master = result; render() }
                  }
              }

              private fun recordRecent(pk: String) {
                  val l = listOf(pk) + store.list("recent").filter { it != pk }
                  store.put("recent", l.take(8).joinToString(","))
              }

              private fun launchApp(a: AppItem) {
                  try { startActivity(a.intent); recordRecent(a.pkg) } catch (e: Exception) { toast("Can't open " + a.label) }
              }

              private fun openApp(a: AppItem) {
                  if (a.pkg.startsWith("rec:")) { openRec(a); return }
                  val f = splitFirst
                  splitFirst = null
                  if (f != null && f.pkg != a.pkg) {
                      try {
                          startActivity(f.intent); recordRecent(f.pkg)
                          handler.postDelayed({
                              try {
                                  startActivity(Intent(a.intent).addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT or Intent.FLAG_ACTIVITY_MULTIPLE_TASK))
                                  recordRecent(a.pkg)
                              } catch (e: Exception) { toast("Couldn't open the second app") }
                          }, 900)
                      } catch (e: Exception) { toast("Couldn't open the first app") }
                  } else launchApp(a)
              }

              private fun splitSupported(): Boolean = try {
                  val id = Resources.getSystem().getIdentifier("config_supportsSplitScreenMultiWindow", "bool", "android")
                  id != 0 && Resources.getSystem().getBoolean(id)
              } catch (e: Exception) { false }

              private fun startSplit(a: AppItem) {
                  if (!splitSupported()) { toast("This TV's system doesn't support split screen"); return }
                  splitFirst = a
                  toast("Now pick the second app")
              }

              private fun saveOrder(l: List<String>) { store.put("order", l.joinToString(",")); render() }

              private fun move(pk: String, dir: Int) {
                  val l = shown.map { it.pkg }.toMutableList()
                  val i = l.indexOf(pk)
                  val j = i + dir
                  if (i < 0 || j < 0 || j >= l.size) return
                  Collections.swap(l, i, j)
                  saveOrder(l)
              }

              // ---------- menus ----------
              private fun showMenu(title: String, items: List<MI>) {
                  val old = overlay
                  if (old == null) focusBefore = currentFocus else root.removeView(old)
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(14))
                      background = GradientDrawable().apply { setColor(0xF2121826.toInt()); cornerRadius = dp(18).toFloat() }
                  }
                  panel.addView(TextView(this).apply {
                      text = title; setTextColor(Color.WHITE); textSize = 20f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setPadding(dp(8), 0, 0, dp(10))
                  })
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  var first: View? = null
                  for (mi in items) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(14), 0, dp(14), 0)
                          isFocusable = true
                          background = pillBg(10)
                      }
                      val l = TextView(this).apply { text = mi.label; setTextColor(Color.WHITE); textSize = 16f; maxLines = 1 }
                      val v = TextView(this).apply { text = mi.value?.invoke() ?: ""; setTextColor(0xFF9DB4FF.toInt()); textSize = 15f }
                      row.addView(l, LinearLayout.LayoutParams(0, -2, 1f))
                      row.addView(v)
                      row.setOnClickListener {
                          if (mi.keep) { mi.run(); v.text = mi.value?.invoke() ?: "" } else { closeMenu(); mi.run() }
                      }
                      list.addView(row, LinearLayout.LayoutParams(-1, dp(46)))
                      if (first == null) first = row
                  }
                  val sv = ScrollView(this).apply { isVerticalScrollBarEnabled = false; addView(list) }
                  panel.addView(sv, LinearLayout.LayoutParams(-1, minOf(dp(46) * items.size, dp(300))))
                  val ov = FrameLayout(this).apply {
                      setBackgroundColor(0xB3000000.toInt())
                      isClickable = true
                      addView(panel, FrameLayout.LayoutParams(dp(420), -2, Gravity.CENTER))
                  }
                  overlay = ov
                  root.addView(ov, FrameLayout.LayoutParams(-1, -1))
                  content.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  first?.requestFocus()
              }

              private fun closeMenu() {
                  overlay?.let { root.removeView(it) }
                  overlay = null
                  content.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  val f = focusBefore
                  focusBefore = null
                  if (f != null && f.isAttachedToWindow) f.requestFocus() else row1.post { row1.getChildAt(0)?.requestFocus() }
              }

