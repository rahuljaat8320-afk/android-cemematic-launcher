              private fun packName(): String {
                  val p = store.get("iconpack", "")
                  return when (p) {
                      "" -> "Original"
                      "@mono" -> "Monochrome"
                      "@round" -> "Round badge"
                      "@squircle" -> "Squircle badge"
                      else -> try { packageManager.getApplicationLabel(packageManager.getApplicationInfo(p, 0)).toString() } catch (e: Exception) { "Original" }
                  }
              }

              private fun findIconPacks(): List<Pair<String, String>> {
                  val out = LinkedHashMap<String, String>()
                  val actions = listOf("org.adw.launcher.THEMES", "com.novalauncher.THEME", "com.anddoes.launcher.THEME", "com.gau.go.launcherex.theme")
                  for (a in actions) {
                      try {
                          for (ri in packageManager.queryIntentActivities(Intent(a), 0)) {
                              val pk = ri.activityInfo.packageName
                              if (!out.containsKey(pk)) out[pk] = ri.loadLabel(packageManager).toString()
                          }
                      } catch (e: Exception) { }
                  }
                  return out.map { it.key to it.value }
              }

              private fun setPack(v: String) {
                  store.put("iconpack", v)
                  applyLook()
                  toast("Icons: " + packName())
              }

              private fun iconPackMenu() {
                  val cur = store.get("iconpack", "")
                  fun mark(v: String) = if (cur == v) "\u25CF " else "    "
                  val items = ArrayList<MI>()
                  items.add(MI(mark("") + "Original app icons") { setPack("") })
                  items.add(MI(mark("@mono") + "Monochrome (cream logos)") { setPack("@mono") })
                  items.add(MI(mark("@round") + "Round badge") { setPack("@round") })
                  items.add(MI(mark("@squircle") + "Squircle badge") { setPack("@squircle") })
                  val packs = findIconPacks()
                  for ((pk, label) in packs) items.add(MI(mark(pk) + label + "  (icon pack)") { setPack(pk) })
                  if (packs.isEmpty()) items.add(MI("No icon-pack apps installed. Get one from Play Store.") { openStore() })
                  showMenu("Icon pack", items, back = { tilesMenu() }, side = true)
              }

              // ---------- default launcher ----------
              private fun isDefaultHome(): Boolean = try {
                  val ri = packageManager.resolveActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), PackageManager.MATCH_DEFAULT_ONLY)
                  ri?.activityInfo?.packageName == packageName
              } catch (e: Exception) { false }

              private fun setAsDefault() {
                  if (isDefaultHome()) { toast("Cine Launcher is already your home screen"); return }
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          val rm = getSystemService(android.app.role.RoleManager::class.java)
                          if (rm != null && rm.isRoleAvailable(android.app.role.RoleManager.ROLE_HOME)) {
                              startActivityForResult(rm.createRequestRoleIntent(android.app.role.RoleManager.ROLE_HOME), 79)
                              return
                          }
                      }
                  } catch (e: Exception) { }
                  try {
                      startActivity(Intent(Settings.ACTION_HOME_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return
                  } catch (e: Exception) { }
                  toast("Press Home and pick Cine Launcher > Always. Or: adb shell cmd package set-home-activity com.cine.launcher/.MainActivity")
              }

              private fun askDefaultOnce() {
                  if (isFinishing || store.gget("askhome") == "1" || isDefaultHome()) return
                  store.gput("askhome", "1")
                  try {
                      AlertDialog.Builder(this)
                          .setTitle("Make Cine Launcher your home screen?")
                          .setMessage("Then the Home button always brings you here.")
                          .setPositiveButton("Yes") { _, _ -> setAsDefault() }
                          .setNegativeButton("Later", null)
                          .show()
                  } catch (e: Exception) { }
              }

