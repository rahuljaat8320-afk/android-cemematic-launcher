              // ---------- direct settings shortcuts ----------
              private val settingsPkgs = listOf("com.xiaomi.mitv.settings", "com.android.tv.settings", "com.android.settings")

              private fun kindWords(kind: String): List<String> = when (kind) {
                  "bt" -> listOf("bluetooth", "accessor")
                  "wifi" -> listOf("wifi", "wlan")
                  "audio" -> listOf("sound", "audio")
                  else -> listOf("display", "picture", "video")
              }

              private fun settingsCands(kind: String): List<Intent> {
                  val l = ArrayList<Intent>()
                  when (kind) {
                      "bt" -> {
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.accessories.AddAccessoryActivity"))
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.accessories.BluetoothAccessoryActivity"))
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.accessories.AccessoriesActivity"))
                          l.add(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                      }
                      "wifi" -> {
                          l.add(Intent(Settings.ACTION_WIFI_SETTINGS))
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.connectivity.WifiSettingsActivity"))
                      }
                      "audio" -> {
                          l.add(Intent(Settings.ACTION_SOUND_SETTINGS))
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.device.sound.SoundActivity"))
                      }
                      else -> {
                          l.add(Intent(Settings.ACTION_DISPLAY_SETTINGS))
                          l.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.device.display.DisplayActivity"))
                      }
                  }
                  return l
              }

              private fun findActs(words: List<String>): List<Intent> {
                  val out = ArrayList<Intent>()
                  for (pkg in settingsPkgs) {
                      try {
                          val acts = packageManager.getPackageInfo(pkg, PackageManager.GET_ACTIVITIES).activities ?: continue
                          for (a in acts) {
                              if (!a.exported || !a.enabled) continue
                              val n = a.name.lowercase()
                              if (words.any { n.contains(it) }) out.add(Intent().setClassName(pkg, a.name))
                          }
                      } catch (e: Exception) { }
                  }
                  return out
              }

              private fun openShortcut(kind: String) {
                  val saved = store.gget("sc_" + kind)
                  if (saved.contains("/")) {
                      try {
                          startActivity(Intent().setClassName(saved.substringBefore("/"), saved.substringAfter("/")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          return
                      } catch (e: Exception) { }
                  }
                  val all = ArrayList<Intent>()
                  all.addAll(settingsCands(kind))
                  all.addAll(findActs(kindWords(kind)))
                  for (i in all) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (i.resolveActivity(packageManager) != null) {
                          try { startActivity(i); return } catch (e: Exception) { }
                      }
                  }
                  toast("No direct page found. Hold OK on this button to pick one.")
                  sys(Settings.ACTION_SETTINGS)
              }

              private fun pickSettingsPage(kind: String) {
                  val words = kindWords(kind)
                  val all = ArrayList<Pair<String, String>>()
                  for (pkg in settingsPkgs) {
                      try {
                          val acts = packageManager.getPackageInfo(pkg, PackageManager.GET_ACTIVITIES).activities ?: continue
                          for (a in acts) {
                              if (!a.exported || !a.enabled) continue
                              all.add(pkg to a.name)
                          }
                      } catch (e: Exception) { }
                  }
                  val filtered = all.filter { p -> words.any { p.second.lowercase().contains(it) } }
                  val use = if (filtered.isEmpty()) all else filtered
                  val items = ArrayList<MI>()
                  items.add(MI("Use default (reset)") { store.gput("sc_" + kind, ""); toast("Back to default") })
                  for ((pkg, nm) in use) {
                      items.add(MI(pkg.substringAfterLast('.') + ": " + nm.substringAfterLast('.')) {
                          store.gput("sc_" + kind, pkg + "/" + nm)
                          openShortcut(kind)
                      })
                  }
                  showMenu("Pick the page this button opens", items)
              }

              // ---------- system stats ----------
              private fun statSet(tv: TextView, bar: ProgressBar, name: String, v: Int?, approx: Boolean) {
                  tv.text = if (v == null) name + " n/a" else name + (if (approx) " ~" else " ") + v + "%"
                  bar.progress = v ?: 0
              }

              private fun updateStats() {
                  if (statsBox.visibility != View.VISIBLE) return
                  cpuApprox = false
                  gpuApprox = false
                  statSet(cpuTv, cpuBar, "CPU", cpuPct(), cpuApprox)
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val used = if (mi.totalMem > 0) (100 * (mi.totalMem - mi.availMem) / mi.totalMem).toInt() else null
                  statSet(ramTv, ramBar, "RAM", used, false)
                  statSet(gpuTv, gpuBar, "GPU", gpuPct(), gpuApprox)
              }

              private fun cpuPct(): Int? {
                  try {
                      val line = File("/proc/stat").bufferedReader().use { it.readLine() } ?: return null
                      val n = line.trim().split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                      if (n.size >= 5) {
                          val idle = n[3] + n[4]
                          val total = n.sum()
                          val dT = total - prevTotal
                          val dI = idle - prevIdle
                          val first = prevTotal == 0L
                          prevTotal = total; prevIdle = idle
                          if (!first && dT > 0) return (100 * (dT - dI) / dT).toInt().coerceIn(0, 100)
                      }
                  } catch (e: Exception) { }
                  cpuApprox = true
                  return freqPct()
              }

              private fun freqPct(): Int? = try {
                  var cur = 0L
                  var max = 0L
                  for (i in 0 until 16) {
                      val b = "/sys/devices/system/cpu/cpu" + i + "/cpufreq/"
                      val c = File(b + "scaling_cur_freq")
                      val m = File(b + "cpuinfo_max_freq")
                      if (c.canRead() && m.canRead()) {
                          cur += c.readText().trim().toLong()
                          max += m.readText().trim().toLong()
                      }
                  }
                  if (max > 0) (100 * cur / max).toInt().coerceIn(0, 100) else null
              } catch (e: Exception) { null }

              private val gpuFiles = listOf(
                  "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage", "/sys/class/kgsl/kgsl-3d0/devfreq/gpu_load",
                  "/sys/class/mpgpu/utilization", "/sys/kernel/ged/hal/gpu_utilization",
                  "/sys/class/misc/mali0/device/utilisation", "/sys/devices/platform/mali.0/utilization"
              )

              private fun gpuPct(): Int? {
                  for (p in gpuFiles) {
                      try {
                          val f = File(p)
                          if (f.canRead()) {
                              val m = Regex("\\d+").find(f.readText())
                              if (m != null) return m.value.toInt().coerceIn(0, 100)
                          }
                      } catch (e: Exception) { }
                  }
                  try {
                      val dirs = File("/sys/class/devfreq").listFiles() ?: return null
                      for (d in dirs) {
                          val nm = d.name.lowercase()
                          if (!(nm.contains("mali") || nm.contains("gpu"))) continue
                          val c = File(d, "cur_freq")
                          val m = File(d, "max_freq")
                          if (c.canRead() && m.canRead()) {
                              gpuApprox = true
                              return (100 * c.readText().trim().toLong() / m.readText().trim().toLong()).toInt().coerceIn(0, 100)
                          }
                      }
                  } catch (e: Exception) { }
                  return null
              }

              // ---------- lifecycle ----------
              override fun onStart() {
                  super.onStart()
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_REPLACED)
                      addDataScheme("package")
                  }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(pkgReceiver, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(pkgReceiver, f)
                  loadApps()
                  handler.post(tick)
                  handler.post(statsTick)
              }

              override fun onResume() {
                  super.onResume()
                  if (launchedAway) { launchedAway = false; playReturn() }
              }

              override fun onStop() {
                  super.onStop()
                  launchedAway = true
                  unregisterReceiver(pkgReceiver)
                  handler.removeCallbacks(tick)
                  handler.removeCallbacks(statsTick)
              }

              // Animates the home screen coming back after an app closes. The closing animation of the other app belongs to that app / the system.
              private fun playReturn() {
                  val m = store.sel("aclose")
                  if (!look.anim || m == 0) return
                  val d = adur() + 100
                  val c = content
                  c.animate().cancel()
                  val ip = DecelerateInterpolator()
                  when (m) {
                      1 -> { c.alpha = 0f; c.animate().alpha(1f).setInterpolator(ip).setDuration(d).start() }
                      2 -> { c.scaleX = 1.1f; c.scaleY = 1.1f; c.alpha = 0f; c.animate().scaleX(1f).scaleY(1f).alpha(1f).setInterpolator(ip).setDuration(d).start() }
                      3 -> { c.scaleX = 0.9f; c.scaleY = 0.9f; c.alpha = 0f; c.animate().scaleX(1f).scaleY(1f).alpha(1f).setInterpolator(ip).setDuration(d).start() }
                      4 -> { c.translationY = dp(80).toFloat(); c.alpha = 0f; c.animate().translationY(0f).alpha(1f).setInterpolator(ip).setDuration(d).start() }
                      5 -> { c.translationY = -dp(80).toFloat(); c.alpha = 0f; c.animate().translationY(0f).alpha(1f).setInterpolator(ip).setDuration(d).start() }
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (overlay != null) closeMenu()
                  focusPending = true
                  row1.scrollToPosition(0)
                  row1.post { row1.getChildAt(0)?.requestFocus() }
              }

              @Deprecated("Home screen: back only closes menus")
              override fun onBackPressed() {
                  if (overlay != null) {
                      val b = menuBack
                      if (b != null) b() else closeMenu()
                  } else splitFirst = null
              }

              private fun updateTime() {
                  val now = Date()
                  clock.text = DateFormat.getTimeFormat(this).format(now)
                  date.text = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(now)
              }
          }
