              // ---------- system stats tile ----------
              private fun statTv() = TextView(this).apply { setTextColor(0xCCFFFFFF.toInt()); textSize = 11f }

              private fun statBar(color: Int): ProgressBar {
                  val b = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  b.max = 100
                  b.progressTintList = ColorStateList.valueOf(color)
                  b.progressBackgroundTintList = ColorStateList.valueOf(0x33FFFFFF)
                  return b
              }

              private fun statCol(tv: TextView, bar: ProgressBar): View {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(8), 0, dp(8), 0)
                  col.addView(tv)
                  col.addView(bar, LinearLayout.LayoutParams(dp(72), dp(4)).apply { topMargin = dp(4) })
                  return col
              }

              private fun statSet(tv: TextView, bar: ProgressBar, name: String, v: Int?, approx: Boolean) {
                  tv.text = if (v == null) name + " n/a" else name + (if (approx) " ~" else " ") + v + "%"
                  bar.progress = v ?: 0
              }

              private fun updateStats() {
                  if (statsBox.visibility != View.VISIBLE) return
                  cpuApprox = false
                  gpuApprox = false
                  statSet(cpuTv, cpuBar, "CPU", cpuPct(), cpuApprox)
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val used = if (mi.totalMem > 0) (100 * (mi.totalMem - mi.availMem) / mi.totalMem).toInt() else null
                  statSet(ramTv, ramBar, "RAM", used, false)
                  statSet(gpuTv, gpuBar, "GPU", gpuPct(), gpuApprox)
              }

              private fun cpuPct(): Int? {
                  try {
                      val line = File("/proc/stat").bufferedReader().use { it.readLine() } ?: return null
                      val n = line.trim().split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                      if (n.size >= 5) {
                          val idle = n[3] + n[4]
                          val total = n.sum()
                          val dT = total - prevTotal
                          val dI = idle - prevIdle
                          val first = prevTotal == 0L
                          prevTotal = total; prevIdle = idle
                          if (!first && dT > 0) return (100 * (dT - dI) / dT).toInt().coerceIn(0, 100)
                      }
                  } catch (e: Exception) { }
                  cpuApprox = true
                  return freqPct()
              }

              private fun freqPct(): Int? = try {
                  var cur = 0L
                  var max = 0L
                  for (i in 0 until 16) {
                      val b = "/sys/devices/system/cpu/cpu" + i + "/cpufreq/"
                      val c = File(b + "scaling_cur_freq")
                      val m = File(b + "cpuinfo_max_freq")
                      if (c.canRead() && m.canRead()) {
                          cur += c.readText().trim().toLong()
                          max += m.readText().trim().toLong()
                      }
                  }
                  if (max > 0) (100 * cur / max).toInt().coerceIn(0, 100) else null
              } catch (e: Exception) { null }

              private val gpuFiles = listOf(
                  "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage", "/sys/class/kgsl/kgsl-3d0/devfreq/gpu_load",
                  "/sys/class/mpgpu/utilization", "/sys/kernel/ged/hal/gpu_utilization",
                  "/sys/class/misc/mali0/device/utilisation", "/sys/devices/platform/mali.0/utilization"
              )

              private fun gpuPct(): Int? {
                  for (p in gpuFiles) {
                      try {
                          val f = File(p)
                          if (f.canRead()) {
                              val m = Regex("\\d+").find(f.readText())
                              if (m != null) return m.value.toInt().coerceIn(0, 100)
                          }
                      } catch (e: Exception) { }
                  }
                  try {
                      val dirs = File("/sys/class/devfreq").listFiles() ?: return null
                      for (d in dirs) {
                          val nm = d.name.lowercase()
                          if (!(nm.contains("mali") || nm.contains("gpu"))) continue
                          val c = File(d, "cur_freq")
                          val m = File(d, "max_freq")
                          if (c.canRead() && m.canRead()) {
                              gpuApprox = true
                              return (100 * c.readText().trim().toLong() / m.readText().trim().toLong()).toInt().coerceIn(0, 100)
                          }
                      }
                  } catch (e: Exception) { }
                  return null
              }

              // ---------- recommendations (TMDB, optional OMDb for IMDb scores) ----------
              private fun textTile(text: String, color: Int): Drawable {
                  val b = Bitmap.createBitmap(320, 180, Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  c.drawColor(color)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = Color.WHITE
                  p.textAlign = Paint.Align.CENTER
                  p.typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  val lines = text.split("\n")
                  p.textSize = if (lines.size > 1) 34f else 44f
                  var y = if (lines.size > 1) 82f else 104f
                  for (ln in lines) { c.drawText(ln, 160f, y, p); y += 44f }
                  return BitmapDrawable(resources, b)
              }

              private fun infoTile(label: String, pkg: String, text: String, color: Int, meta: String, over: String) =
                  AppItem(label, pkg, Intent(), textTile(text, color), true, color, false, null, meta, over)

              private fun recTiles(): List<AppItem> {
                  val out = ArrayList<AppItem>()
                  when (recState) {
                      0 -> out.add(infoTile("Add your free TMDB key", "rec:setup", "Set up\nrecommendations", 0xFF2563EB.toInt(), "Setup", "Press OK and paste your free TMDB key (themoviedb.org, Settings, API) to see trending and 8+ rated titles here."))
                      1 -> out.add(infoTile("Loading recommendations…", "rec:load", "Loading…", 0xFF374151.toInt(), "Loading", "Fetching trending and top-rated titles…"))
                      3 -> out.add(infoTile("Couldn't load. Press OK to retry", "rec:retry", "Retry", 0xFFB45309.toInt(), "Could not load", "Check your internet connection and key, then press OK to try again."))
                      else -> out.addAll(recs)
                  }
                  if (store.sel("moctale") == 0) out.add(moctale)
                  return out
              }

              private fun openRec(a: AppItem) {
                  when (a.pkg) {
                      "rec:setup" -> promptKey("tmdb")
                      "rec:retry" -> fetchRecs(true)
                      "rec:load" -> { }
                      else -> try { startActivity(a.intent) } catch (e: Exception) { toast("No browser found. Install a browser or the IMDb app to open links.") }
                  }
              }

              private fun recMenu(app: AppItem) {
                  val items = arrayListOf(
                      MI("Open") { openRec(app) },
                      MI("Refresh recommendations") { fetchRecs(true) },
                      MI("Set TMDB key") { promptKey("tmdb") },
                      MI("Set OMDb key (real IMDb ratings)") { promptKey("omdb") },
                      MI("Data credits") { credits() }
                  )
                  showMenu("Recommendations", items)
              }

              private fun credits() {
                  AlertDialog.Builder(this)
                      .setTitle("Data credits")
                      .setMessage("Recommendations and images come from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB. Real IMDb ratings (optional) come from OMDb. The Moctale tile only opens moctale.in.")
                      .setPositiveButton("OK", null)
                      .show()
              }

              private fun promptKey(which: String) {
                  val et = EditText(this)
                  et.setSingleLine()
                  et.setText(store.gget(which))
                  val tmdbKey = which == "tmdb"
                  AlertDialog.Builder(this)
                      .setTitle(if (tmdbKey) "TMDB API key" else "OMDb API key (optional)")
                      .setMessage(if (tmdbKey) "Free at themoviedb.org: Settings, then API. Paste the API key or the read access token."
                                  else "Free at omdbapi.com/apikey.aspx (1,000 requests a day). Gives real IMDb ratings on tiles.")
                      .setView(et)
                      .setPositiveButton("Save") { _, _ -> store.gput(which, et.text.toString().trim()); fetchRecs(true) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun js(o: JSONObject, k: String): String = if (o.isNull(k)) "" else o.optString(k, "")

              private fun get(url: String, bearer: String?): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 8000
                  c.readTimeout = 10000
                  if (bearer != null) c.setRequestProperty("Authorization", "Bearer " + bearer)
                  try { return c.inputStream.bufferedReader().use { it.readText() } } finally { c.disconnect() }
              }

              private fun tmdb(path: String, key: String): String {
                  val base = "https://api.themoviedb.org/3/" + path
                  return if (key.length > 40) get(base, key)
                  else get(base + (if (path.contains("?")) "&" else "?") + "api_key=" + key, null)
              }

              private fun bitmap(path: String): Bitmap? = try {
                  URL("https://image.tmdb.org/t/p/w300" + path).openStream().use { BitmapFactory.decodeStream(it) }
              } catch (e: Exception) { null }

              private fun fetchRecs(force: Boolean) {
                  if (store.sel("toprow") != 0) return
                  val key = store.gget("tmdb")
                  if (key.isEmpty()) { recState = 0; render(); return }
                  if (!force && recState == 2 && System.currentTimeMillis() - recTime < 3 * 3600_000L) return
                  recState = 1
                  render()
                  val minR = doubleArrayOf(7.5, 8.0, 8.5)[store.sel("minr")]
                  val type = store.sel("rtype")
                  val omdb = store.gget("omdb")
                  net.execute {
                      try {
                          val raws = ArrayList<RecRaw>()
                          val seen = HashSet<String>()
                          fun addAll(arr: JSONArray, defMt: String, badge: String, max: Int) {
                              var n = 0
                              for (i in 0 until arr.length()) {
                                  if (n >= max) break
                                  val o = arr.getJSONObject(i)
                                  val mt = if (o.isNull("media_type")) defMt else o.getString("media_type")
                                  if (mt != "movie" && mt != "tv") continue
                                  val id = o.getInt("id")
                                  if (!seen.add(mt + id)) continue
                                  val img = js(o, "backdrop_path").ifEmpty { js(o, "poster_path") }
                                  if (img.isEmpty()) continue
                                  val title = js(o, "title").ifEmpty { js(o, "name") }
                                  raws.add(RecRaw(id, mt, title, o.optDouble("vote_average", 0.0), img, badge))
                                  n++
                              }
                          }
                          val tr = if (type == 1) "trending/movie/week" else if (type == 2) "trending/tv/week" else "trending/all/week"
                          addAll(JSONObject(tmdb(tr, key)).getJSONArray("results"), if (type == 2) "tv" else "movie", "TRENDING", 8)
                          for (mt in listOf("movie", "tv")) {
                              if ((type == 1 && mt == "tv") || (type == 2 && mt == "movie")) continue
                              val u = "discover/" + mt + "?sort_by=popularity.desc&vote_average.gte=" + minR + "&vote_count.gte=1500&language=en-US"
                              addAll(JSONObject(tmdb(u, key)).getJSONArray("results"), mt, "TOP RATED", 8)
                          }
                          val tiles = ArrayList<AppItem>()
                          for (r in raws) {
                              var imdb = ""
                              var facts = if (r.mt == "movie") "Movie" else "Series"
                              var overview = ""
                              var votesN = 0
                              try {
                                  val dj = JSONObject(tmdb(r.mt + "/" + r.id + "?append_to_response=external_ids&language=en-US", key))
                                  if (!dj.isNull("external_ids")) imdb = js(dj.getJSONObject("external_ids"), "imdb_id")
                                  overview = js(dj, "overview")
                                  votesN = dj.optInt("vote_count", 0)
                                  val genres = ArrayList<String>()
                                  val ga = dj.optJSONArray("genres")
                                  if (ga != null) for (i in 0 until minOf(ga.length(), 3)) genres.add(ga.getJSONObject(i).optString("name"))
                                  val countries = ArrayList<String>()
                                  val pc = dj.optJSONArray("production_countries")
                                  if (pc != null) for (i in 0 until minOf(pc.length(), 2)) countries.add(pc.getJSONObject(i).optString("name"))
                                  if (countries.isEmpty()) {
                                      val oc = dj.optJSONArray("origin_country")
                                      if (oc != null) for (i in 0 until minOf(oc.length(), 2)) countries.add(Locale("", oc.getString(i)).getDisplayCountry(Locale.ENGLISH))
                                  }
                                  val lang = js(dj, "original_language")
                                  val langName = if (lang.isEmpty()) "" else Locale(lang).getDisplayLanguage(Locale.ENGLISH)
                                  val year = js(dj, if (r.mt == "movie") "release_date" else "first_air_date").take(4)
                                  var length = ""
                                  if (r.mt == "movie") {
                                      val m = dj.optInt("runtime", 0)
                                      if (m > 0) length = (m / 60).toString() + "h " + (m % 60) + "m"
                                  } else {
                                      val sn = dj.optInt("number_of_seasons", 0)
                                      if (sn > 0) length = sn.toString() + (if (sn > 1) " seasons" else " season")
                                  }
                                  facts = listOf(if (r.mt == "movie") "Movie" else "Series", year, genres.joinToString(", "), countries.joinToString(", "), langName, length)
                                      .filter { it.isNotEmpty() }.joinToString("  ·  ")
                              } catch (x: Exception) { }
                              var rating = r.rating
                              var src = "TMDB"
                              if (omdb.isNotEmpty() && imdb.isNotEmpty()) {
                                  try {
                                      val v = js(JSONObject(get("https://www.omdbapi.com/?i=" + imdb + "&apikey=" + omdb, null)), "imdbRating").toDoubleOrNull()
                                      if (v != null) { rating = v; src = "IMDB" }
                                  } catch (x: Exception) { }
                              }
                              if (r.badge == "TOP RATED" && rating < minR) continue
                              val bmp = bitmap(r.img) ?: continue
                              val d = BitmapDrawable(resources, bmp)
                              val url = if (imdb.isNotEmpty()) "https://www.imdb.com/title/" + imdb + "/" else "https://www.themoviedb.org/" + r.mt + "/" + r.id
                              val label = r.title + "  ★ " + String.format(Locale.US, "%.1f", rating)
                              val metaLine = "★ " + String.format(Locale.US, "%.1f", rating) + " " + src +
                                  (if (src == "TMDB" && votesN > 0) " (" + votesN + " votes)" else "") + "  ·  " + facts
                              tiles.add(AppItem(label, "rec:" + r.mt + r.id,
                                  Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                                  d, true, tintOf(d), false, r.badge + " · " + src, metaLine, overview))
                          }
                          val a = tiles.filter { it.badge?.startsWith("TRENDING") == true }
                          val b = tiles.filter { it.badge?.startsWith("TRENDING") != true }
                          val mixed = ArrayList<AppItem>()
                          for (i in 0 until maxOf(a.size, b.size)) {
                              if (i < a.size) mixed.add(a[i])
                              if (i < b.size) mixed.add(b[i])
                          }
                          runOnUiThread { recs = mixed; recState = if (mixed.isEmpty()) 3 else 2; recTime = System.currentTimeMillis(); render() }
                      } catch (e: Exception) {
                          runOnUiThread { recState = 3; render() }
                      }
                  }
              }

              private fun advanceRecs() {
                  if (overlay != null || store.sel("layout") != 0 || store.sel("toprow") != 0) return
                  if (rowR.visibility != View.VISIBLE || rowR.hasFocus() || aR.items.size < 4) return
                  if (rowR.canScrollHorizontally(1)) rowR.smoothScrollBy(dp(aR.cw + 22), 0) else rowR.smoothScrollToPosition(0)
              }

              private fun showDetails(app: AppItem) {
                  val has = app.meta != null
                  detBox.visibility = if (has) View.VISIBLE else View.GONE
                  heroBox.visibility = if (has) View.INVISIBLE else if (store.sel("clock") == 0) View.VISIBLE else View.GONE
                  if (has) {
                      detTitle.text = app.label
                      detMeta.text = app.meta
                      detOver.text = app.overview ?: ""
                  }
              }

              private fun quickMenu() {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val items = arrayListOf(
                      MI("Wi-Fi", value = { if (wifiOn()) "On" else "Off" }, keep = true) { toggleWifi() },
                      MI("Bluetooth", value = { if (btOn()) "On" else "Off" }, keep = true) { toggleBt() },
                      MI("Mute", value = { if (am.isStreamMute(AudioManager.STREAM_MUSIC)) "On" else "Off" }, keep = true) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI)
                      },
                      MI("Volume up", keep = true) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI) },
                      MI("Volume down", keep = true) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI) },
                      MI("Audio output", value = { outputs() }) { sys(Settings.ACTION_SOUND_SETTINGS) },
                      MI("Video input (HDMI, AV)") { inputsMenu() },
                      MI("Display settings") { sys(Settings.ACTION_DISPLAY_SETTINGS) },
                      MI("Screen saver") { sys("android.settings.DREAM_SETTINGS") },
                      MI("Split screen", value = { if (splitSupported()) "Supported" else "Not supported" }) {
                          toast(if (splitSupported()) "Hold OK on an app, then Open side by side" else "This TV's system doesn't allow split screen")
                      }
                  )
                  showMenu("Quick settings", items)
              }

              // ---------- direct Audio / Video settings shortcuts ----------
              private fun openShortcut(kind: String) {
                  val saved = store.gget("sc_" + kind)
                  if (saved.contains("/")) {
                      try {
                          startActivity(Intent().setClassName(saved.substringBefore("/"), saved.substringAfter("/")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          return
                      } catch (e: Exception) { }
                  }
                  val cands = ArrayList<Intent>()
                  if (kind == "audio") {
                      cands.add(Intent(Settings.ACTION_SOUND_SETTINGS))
                      cands.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.device.sound.SoundActivity"))
                  } else {
                      cands.add(Intent(Settings.ACTION_DISPLAY_SETTINGS))
                      cands.add(Intent().setClassName("com.android.tv.settings", "com.android.tv.settings.device.display.DisplayActivity"))
                  }
                  for (i in cands) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (i.resolveActivity(packageManager) != null) {
                          try { startActivity(i); return } catch (e: Exception) { }
                      }
                  }
                  toast("No direct page found. Hold OK on this button to pick one.")
                  sys(Settings.ACTION_SETTINGS)
              }

              private fun pickSettingsPage(kind: String) {
                  val pm = packageManager
                  val items = ArrayList<MI>()
                  items.add(MI("Use default (reset)") { store.gput("sc_" + kind, ""); toast("Back to default") })
                  for (pkg in listOf("com.xiaomi.mitv.settings", "com.android.tv.settings", "com.android.settings")) {
                      try {
                          val acts = pm.getPackageInfo(pkg, PackageManager.GET_ACTIVITIES).activities ?: continue
                          for (a in acts) {
                              if (!a.exported || !a.enabled) continue
                              val nm = a.name
                              items.add(MI(pkg.substringAfterLast('.') + ": " + nm.substringAfterLast('.')) {
                                  store.gput("sc_" + kind, pkg + "/" + nm)
                                  openShortcut(kind)
                              })
                          }
                      } catch (e: Exception) { }
                  }
                  showMenu(if (kind == "audio") "Tap a page to open and save as Audio" else "Tap a page to open and save as Video", items)
              }

              // ---------- lifecycle ----------
              override fun onStart() {
                  super.onStart()
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_REPLACED)
                      addDataScheme("package")
                  }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(pkgReceiver, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(pkgReceiver, f)
                  loadApps()
                  fetchRecs(false)
                  handler.post(tick)
                  handler.post(statsTick)
                  handler.postDelayed(carousel, 6000)
              }

              override fun onStop() {
                  super.onStop()
                  unregisterReceiver(pkgReceiver)
                  handler.removeCallbacks(tick)
                  handler.removeCallbacks(statsTick)
                  handler.removeCallbacks(carousel)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (overlay != null) closeMenu()
                  focusPending = true
                  row1.scrollToPosition(0)
                  row1.post { row1.getChildAt(0)?.requestFocus() }
              }

              @Deprecated("Home screen: back only closes menus")
              override fun onBackPressed() {
                  if (overlay != null) closeMenu() else splitFirst = null
              }

              private fun updateTime() {
                  val now = Date()
                  clock.text = DateFormat.getTimeFormat(this).format(now)
                  date.text = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(now)
                  val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val part = when {
                      h < 5 -> "Good night"
                      h < 12 -> "Good morning"
                      h < 17 -> "Good afternoon"
                      else -> "Good evening"
                  }
                  greeting.text = part + ", " + store.profile().getString("name")
              }
          }
