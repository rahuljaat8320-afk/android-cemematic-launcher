name: Build Cine Launcher APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'CINE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.cine.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.cine.launcher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("debug") // fine for sideloading
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          CINE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:label="Cine Launcher"
                  android:theme="@style/Theme.Cine">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:resumeWhilePausing="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/AppAdapter.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          data class AppItem(
              val label: String,
              val pkg: String,
              val intent: Intent,
              val image: Drawable,
              val isBanner: Boolean
          )

          /** One row of tvOS-style cards. cardWdp/cardHdp let us reuse it for a big and a small row. */
          class AppAdapter(
              private val cardWdp: Int,
              private val cardHdp: Int,
              private val onFocus: (AppItem) -> Unit,
              private val onOpen: (AppItem) -> Unit,
              private val onMenu: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {

              var items: List<AppItem> = emptyList()

              class VH(
                  val root: LinearLayout, val card: FrameLayout, val img: ImageView,
                  val sheen: View, val label: TextView
              ) : RecyclerView.ViewHolder(root)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val c = parent.context
                  val d = c.resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()
                  val radius = dp(18).toFloat()

                  val root = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      clipChildren = false
                      layoutParams = RecyclerView.LayoutParams(dp(cardWdp), -2).apply { marginEnd = dp(24) }
                  }
                  val card = FrameLayout(c).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(cardWdp), dp(cardHdp))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR, intArrayOf(0xFF262C3D.toInt(), 0xFF141824.toInt())
                      ).apply { cornerRadius = radius }
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, o: Outline) { o.setRoundRect(0, 0, v.width, v.height, radius) }
                      }
                      clipToOutline = true
                      isFocusable = true
                      isFocusableInTouchMode = false
                  }
                  val img = ImageView(c).apply { layoutParams = FrameLayout.LayoutParams(-1, -1) }
                  val sheen = View(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(0x55FFFFFF, 0x10FFFFFF, 0x00FFFFFF)
                      )
                      alpha = 0f
                  }
                  card.addView(img); card.addView(sheen)

                  val label = TextView(c).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(14) }
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      maxLines = 1
                      alpha = 0f
                  }
                  root.addView(card); root.addView(label)
                  return VH(root, card, img, sheen, label)
              }

              override fun onBindViewHolder(h: VH, position: Int) {
                  val item = items[position]
                  val d = h.card.resources.displayMetrics.density
                  h.img.setImageDrawable(item.image)
                  if (item.isBanner) {
                      h.img.scaleType = ImageView.ScaleType.CENTER_CROP
                      h.img.setPadding(0, 0, 0, 0)
                  } else {
                      val pad = (cardHdp * 0.2f * d).toInt()
                      h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                      h.img.setPadding(pad, pad, pad, pad)
                  }
                  h.label.text = item.label
                  // reset in case the view is recycled mid-animation
                  h.card.scaleX = 1f; h.card.scaleY = 1f; h.card.translationZ = 0f
                  h.sheen.alpha = 0f; h.label.alpha = 0f

                  h.card.setOnFocusChangeListener { v, focused ->
                      val s = if (focused) 1.13f else 1f
                      v.animate().scaleX(s).scaleY(s).translationZ(if (focused) 28 * d else 0f)
                          .setDuration(160).start()
                      h.sheen.animate().alpha(if (focused) 1f else 0f).setDuration(160).start()
                      h.label.animate().alpha(if (focused) 1f else 0f)
                          .translationY(if (focused) 10 * d else 0f).setDuration(160).start()
                      if (focused) onFocus(item)
                  }
                  h.card.setOnClickListener { onOpen(item) }
                  h.card.setOnLongClickListener { onMenu(item); true }
              }

              override fun getItemCount() = items.size
          }
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/MainActivity.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.format.DateFormat
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private lateinit var clock: TextView
              private lateinit var date: TextView
              private lateinit var heroName: TextView
              private lateinit var row1: RecyclerView
              private lateinit var row2: RecyclerView
              private lateinit var adapter1: AppAdapter
              private lateinit var adapter2: AppAdapter

              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val firstRowCount = 8

              private val tick = object : Runnable {
                  override fun run() { updateTime(); handler.postDelayed(this, 15_000) }
              }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { loadApps() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dm = resources.displayMetrics
                  val d = dm.density
                  fun dp(v: Int) = (v * d).toInt()

                  // tvOS-like soft aurora background: dark base + two blurred colour glows
                  fun glow(color: Int, cx: Float, cy: Float, r: Float) = GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      setGradientCenter(cx, cy)
                      gradientRadius = r
                      colors = intArrayOf(color, 0x00000000)
                  }
                  val bg = LayerDrawable(arrayOf(
                      ColorDrawable(0xFF05060B.toInt()),
                      glow(0x663B4CCA, 0.15f, 0.05f, dm.widthPixels * 0.75f),
                      glow(0x55A23B8C, 0.95f, 0.55f, dm.widthPixels * 0.6f)
                  ))

                  val root = FrameLayout(this).apply { clipChildren = false; background = bg }

                  // top-right clock, like the tvOS menu bar
                  val topRight = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.END
                      setPadding(0, dp(34), dp(64), 0)
                  }
                  clock = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 28f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  }
                  date = TextView(this).apply { setTextColor(0x99FFFFFF.toInt()); textSize = 14f; gravity = Gravity.END }
                  topRight.addView(clock); topRight.addView(date)
                  root.addView(topRight, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END))

                  // hero title for the focused app
                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(64), dp(96), 0, 0)
                  }
                  heroName = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 44f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      maxLines = 1
                  }
                  val hint = TextView(this).apply {
                      setTextColor(0x80FFFFFF.toInt()); textSize = 14f
                      text = "Hold OK for app options"
                  }
                  hero.addView(heroName); hero.addView(hint)
                  root.addView(hero, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START))

                  fun rowOf(a: AppAdapter) = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity, RecyclerView.HORIZONTAL, false)
                      adapter = a
                      clipToPadding = false
                      clipChildren = false
                      setHasFixedSize(true)
                      setPadding(dp(64), dp(22), dp(64), dp(22))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      itemAnimator = null
                  }

                  val onFocus = { app: AppItem -> heroName.text = app.label }
                  val onOpen = { app: AppItem -> try { startActivity(app.intent) } catch (_: Exception) {} }
                  val onMenu = { app: AppItem ->
                      try {
                          startActivity(
                              Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${app.pkg}"))
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      } catch (_: Exception) {}
                  }
                  adapter1 = AppAdapter(240, 135, onFocus, onOpen, onMenu)
                  adapter2 = AppAdapter(180, 101, onFocus, onOpen, onMenu)
                  row1 = rowOf(adapter1)
                  row2 = rowOf(adapter2)

                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      clipChildren = false
                      setPadding(0, 0, 0, dp(16))
                  }
                  bottom.addView(row1, LinearLayout.LayoutParams(-1, -2))
                  bottom.addView(row2, LinearLayout.LayoutParams(-1, -2))
                  root.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))

                  setContentView(root)
              }

              override fun onStart() {
                  super.onStart()
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_REPLACED)
                      addDataScheme("package")
                  }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(pkgReceiver, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(pkgReceiver, f)
                  loadApps()
                  handler.post(tick)
              }

              override fun onStop() {
                  super.onStop()
                  unregisterReceiver(pkgReceiver)
                  handler.removeCallbacks(tick)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  row1.scrollToPosition(0)
                  row1.post { row1.getChildAt(0)?.requestFocus() }
              }

              @Deprecated("Home screen: back does nothing")
              override fun onBackPressed() {}

              private fun updateTime() {
                  val now = Date()
                  clock.text = DateFormat.getTimeFormat(this).format(now)
                  date.text = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(now)
              }

              private fun loadApps() {
                  io.execute {
                      val pm = packageManager
                      val seen = HashSet<String>()
                      val result = ArrayList<AppItem>()

                      fun add(cat: String) {
                          val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                              .filter { it.activityInfo.packageName != packageName }
                              .sortedBy { it.loadLabel(pm).toString().lowercase() }
                          for (ri in apps) {
                              val pkg = ri.activityInfo.packageName
                              if (!seen.add(pkg)) continue
                              val banner = ri.activityInfo.loadBanner(pm) ?: ri.activityInfo.applicationInfo.loadBanner(pm)
                              val intent = Intent(Intent.ACTION_MAIN)
                                  .setClassName(pkg, ri.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                              result.add(AppItem(ri.loadLabel(pm).toString(), pkg, intent, banner ?: ri.loadIcon(pm), banner != null))
                          }
                      }
                      add(Intent.CATEGORY_LEANBACK_LAUNCHER) // TV apps first
                      add(Intent.CATEGORY_LAUNCHER)          // then sideloaded phone apps

                      runOnUiThread {
                          adapter1.items = result.take(firstRowCount)
                          adapter2.items = result.drop(firstRowCount)
                          adapter1.notifyDataSetChanged()
                          adapter2.notifyDataSetChanged()
                          row2.visibility = if (adapter2.items.isEmpty()) View.GONE else View.VISIBLE
                          row1.post {
                              row1.getChildAt(0)?.requestFocus()
                              result.firstOrNull()?.let { heroName.text = it.label }
                          }
                      }
                  }
              }
          }
          CINE_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'CINE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#0A0E1A" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FFFFFF" android:pathData="M140,60L196,90L140,120z" />
          </vector>
          CINE_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'CINE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0E1A" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M42,34L76,54L42,74z" />
          </vector>
          CINE_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'CINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Cine" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          CINE_EOF
          cat > build.gradle.kts <<'CINE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          CINE_EOF
          cat > gradle.properties <<'CINE_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          CINE_EOF
          cat > settings.gradle.kts <<'CINE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CineLauncher"
          include(":app")
          CINE_EOF

      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CineLauncher.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cine Launcher v${{ github.run_number }}
          files: CineLauncher.apk
