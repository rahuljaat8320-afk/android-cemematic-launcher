              }

              // ---------- toggles ----------
              private fun wifiOn(): Boolean = try {
                  (applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager).isWifiEnabled
              } catch (e: Exception) { false }

              private fun btOn(): Boolean = try { BluetoothAdapter.getDefaultAdapter()?.isEnabled == true } catch (e: Exception) { false }

              private fun activeCol(): Int = when (store.sel("bon")) {
                  0 -> 0xFF4ADE80.toInt()
                  1 -> themeAccent()
                  2 -> Color.WHITE
                  else -> 0xFF60A5FA.toInt()
              }

              private fun refreshToggles() {
                  wifiBtn.setColorFilter(if (wifiOn()) activeCol() else 0x88FFFFFF.toInt())
                  btBtn.setColorFilter(if (btOn()) activeCol() else 0x88FFFFFF.toInt())
              }

              private fun toggleWifi() {
                  var ok = false
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION")
                      ok = wm.setWifiEnabled(!wm.isWifiEnabled)
                  } catch (e: Exception) { ok = false }
                  if (!ok) openShortcut("wifi")
                  handler.postDelayed({ refreshToggles() }, 1500)
              }

              // Android 13+ stops normal apps from switching Bluetooth, so when the switch is refused we open the real Bluetooth page.
              private fun toggleBt() {
                  var ok = false
                  try {
                      val a = BluetoothAdapter.getDefaultAdapter()
                      if (a == null) { toast("No Bluetooth on this TV"); return }
                      @Suppress("DEPRECATION")
                      ok = if (a.isEnabled) a.disable() else a.enable()
                  } catch (e: Exception) { ok = false }
                  if (!ok) openShortcut("bt")
                  handler.postDelayed({ refreshToggles() }, 1500)
              }

              private fun outputs(): String = try {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val names = am.getDevices(AudioManager.GET_DEVICES_OUTPUTS).mapNotNull {
                      when (it.type) {
                          AudioDeviceInfo.TYPE_HDMI -> "HDMI"
                          AudioDeviceInfo.TYPE_HDMI_ARC -> "HDMI ARC"
                          AudioDeviceInfo.TYPE_BLUETOOTH_A2DP -> "Bluetooth"
                          AudioDeviceInfo.TYPE_BUILTIN_SPEAKER -> "TV speakers"
                          AudioDeviceInfo.TYPE_WIRED_HEADPHONES, AudioDeviceInfo.TYPE_WIRED_HEADSET -> "Headphones"
                          AudioDeviceInfo.TYPE_USB_DEVICE, AudioDeviceInfo.TYPE_USB_HEADSET -> "USB"
                          else -> null
                      }
                  }.distinct()
                  if (names.isEmpty()) "none found" else names.joinToString(", ")
              } catch (e: Exception) { "unknown" }

              private fun passInputs(): List<TvInputInfo> = try {
                  val tm = getSystemService(Context.TV_INPUT_SERVICE) as TvInputManager
                  tm.tvInputList.filter { it.isPassthroughInput }.sortedBy { inputLabel(it).lowercase() }
              } catch (e: Exception) { emptyList() }

              private fun inputLabel(info: TvInputInfo): String = try {
                  (info.loadCustomLabel(this) ?: info.loadLabel(this)).toString()
              } catch (e: Exception) { info.id }

              private fun switchInput(info: TvInputInfo) {
                  val label = inputLabel(info)
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, TvContract.buildChannelUriForPassthroughInput(info.id)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      store.gput("lastin", info.id)
                  } catch (e: Exception) { toast("Couldn't switch to " + label) }
              }

              // Hold OK on the input button: jump straight to the next input (HDMI 1 -> 2 -> 3 -> ...).
              private fun nextInput() {
                  val ins = passInputs()
                  if (ins.isEmpty()) { toast("No inputs found on this TV"); return }
                  val i = ins.indexOfFirst { it.id == store.gget("lastin") }
                  val next = ins[(i + 1) % ins.size]
                  toast(inputLabel(next))
                  switchInput(next)
              }

              private fun inputsMenu() {
                  val items = ArrayList<MI>()
                  for (info in passInputs()) {
                      val icon = if (info.type == TvInputInfo.TYPE_HDMI) R.drawable.ic_btn_hdmi else R.drawable.ic_btn_input
                      items.add(MI(inputLabel(info), icon = icon) { switchInput(info) })
                  }
                  if (items.isEmpty()) items.add(MI("No inputs found. Open TV settings") { sys(Settings.ACTION_SETTINGS) })
                  showMenu("Switch input", items)
              }

