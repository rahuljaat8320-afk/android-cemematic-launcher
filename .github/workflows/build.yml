          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/AppAdapter.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.animation.TimeInterpolator
          import android.animation.ValueAnimator
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorFilter
          import android.graphics.LinearGradient
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.animation.OvershootInterpolator
          import android.view.animation.PathInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.DiffUtil
          import androidx.recyclerview.widget.RecyclerView

          const val ADD_PKG = "__add__"
          const val STORE_PKG = "com.android.vending"

          /** One shared "ease-out" curve used for tile focus and for row scrolling so everything moves the same way. */
          val EASE = PathInterpolator(0.22f, 1f, 0.36f, 1f)

          /**
           * Tile / button background. Translucent fill so the wallpaper shows through.
           * Call animateFocus() to fade the highlight (brighter fill, shine and outline) in and out smoothly.
           */
          class TileBg(
              private val radius: Float,
              private val color: Int,
              private val fillA: Float,
              private val edge: Boolean,
              private val stroke: Float
          ) : Drawable() {
              var focusP = 0f
              var sheenOn = true
              var ringColor = 0xFFFFFFFF.toInt()
              private var anim: ValueAnimator? = null
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val lineP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val sheenP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val rect = RectF()

              override fun onBoundsChange(bounds: Rect) {
                  sheenP.shader = LinearGradient(
                      bounds.left.toFloat(), bounds.top.toFloat(), bounds.right.toFloat(), bounds.bottom.toFloat(),
                      intArrayOf(0x66FFFFFF, 0x14FFFFFF, 0x00FFFFFF), null, Shader.TileMode.CLAMP
                  )
              }

              fun animateFocus(on: Boolean, ms: Long, interp: TimeInterpolator) {
                  anim?.cancel()
                  val to = if (on) 1f else 0f
                  if (ms <= 0L) { focusP = to; invalidateSelf(); return }
                  anim = ValueAnimator.ofFloat(focusP, to).apply {
                      duration = ms
                      interpolator = interp
                      addUpdateListener { focusP = it.animatedValue as Float; invalidateSelf() }
                      start()
                  }
              }

              override fun draw(c: Canvas) {
                  val b = bounds
                  if (b.isEmpty) return
                  rect.set(b)
                  val half = minOf(rect.width(), rect.height()) / 2f
                  val r = if (radius < 0f) half else minOf(radius, half)
                  path.reset()
                  path.addRoundRect(rect, r, r, Path.Direction.CW)
                  val a = ((fillA + 0.2f * focusP).coerceIn(0f, 1f) * 255f).toInt()
                  fillP.color = (color and 0x00FFFFFF) or (a shl 24)
                  c.drawPath(path, fillP)
                  if (sheenOn && focusP > 0f) {
                      sheenP.alpha = (focusP * 255f).toInt()
                      c.drawPath(path, sheenP)
                  }
                  if (edge) {
                      lineP.strokeWidth = stroke
                      lineP.color = 0x55FFFFFF
                      c.drawPath(path, lineP)
                  }
                  if (focusP > 0f) {
                      lineP.strokeWidth = stroke * 2.5f
                      lineP.color = (ringColor and 0x00FFFFFF) or ((0xCC * focusP).toInt() shl 24)
                      c.drawPath(path, lineP)
                  }
              }

              override fun setAlpha(alpha: Int) {}
              override fun setColorFilter(colorFilter: ColorFilter?) {}
              override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }

          data class AppItem(
              val label: String,
              val pkg: String,
              val intent: Intent,
              val image: Drawable,
              val icon: Drawable,
              val isBanner: Boolean,
              val isAdd: Boolean = false
          )

          class AppAdapter(
              private val look: Look,
              private val onOpen: (AppItem, View) -> Unit,
              private val onMenu: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {

              var items: List<AppItem> = emptyList()
              var moving: String? = null
              var cw = 208
              var ch = 117

              class VH(
                  val root: LinearLayout, val card: FrameLayout, val img: ImageView,
                  val sheen: View, val ring: View, val label: TextView, val inLabel: TextView
              ) : RecyclerView.ViewHolder(root) {
                  var cur: AppItem? = null
              }

              /** Swap in a new list. Uses a diff so tiles slide to their new place instead of the whole row being rebuilt. */
              fun setList(n: List<AppItem>) {
                  val o = items
                  if (o.isEmpty() || n.isEmpty()) { items = n; notifyDataSetChanged(); return }
                  val res = DiffUtil.calculateDiff(object : DiffUtil.Callback() {
                      override fun getOldListSize() = o.size
                      override fun getNewListSize() = n.size
                      override fun areItemsTheSame(a: Int, b: Int) = o[a].pkg == n[b].pkg
                      override fun areContentsTheSame(a: Int, b: Int) = o[a].label == n[b].label && o[a].isBanner == n[b].isBanner && o[a].icon === n[b].icon
                  })
                  items = n
                  res.dispatchUpdatesTo(this)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val c = parent.context
                  val d = c.resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()
                  val radius = dp(look.radius).toFloat()
                  val circle = look.circle

                  val root = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      clipChildren = false
                      layoutParams = RecyclerView.LayoutParams(dp(cw), -2).apply { marginEnd = dp(look.gap) }
                  }
                  val card = FrameLayout(c)
                  card.layoutParams = LinearLayout.LayoutParams(dp(cw), dp(ch))
                  card.background = TileBg(if (circle) -1f else radius, look.fillColor, look.fillA, look.edge, d)
                  card.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) {
                          val r = if (circle) minOf(v.width, v.height) / 2f else radius
                          o.setRoundRect(0, 0, v.width, v.height, r)
                          // A see-through tile gets a faint shadow, a solid one a normal shadow.
                          o.alpha = (if (look.style == 4 && !look.blur) maxOf(look.fillA, 0.55f) else look.fillA).coerceIn(0f, 1f)
                      }
                  }
                  card.clipToOutline = true
                  card.cameraDistance = 9000f * d
                  card.isFocusable = true
                  card.isFocusableInTouchMode = false

                  val img = ImageView(c).apply { layoutParams = FrameLayout.LayoutParams(-1, -1) }
                  val sheen = View(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(0x55FFFFFF, 0x10FFFFFF, 0x00FFFFFF)
                      )
                      alpha = 0f
                  }
                  val ring = View(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      background = GradientDrawable().apply {
                          setColor(0)
                          setStroke(dp(3), look.ringColor)
                          cornerRadius = if (circle) dp(300).toFloat() else radius
                      }
                      alpha = 0f
                  }
                  // Name inside the tile (used by blur mode, where the highlight wraps both logo and name).
                  val inLabel = TextView(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM).apply { bottomMargin = dp(8) }
                      gravity = Gravity.CENTER
                      setTextColor(0xFFEDE8DF.toInt())
                      textSize = 15f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(dp(6), 0, dp(6), 0)
                      visibility = View.GONE
                  }
                  card.addView(img); card.addView(inLabel); card.addView(sheen); card.addView(ring)

                  val label = TextView(c).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) }
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x99000000.toInt())
                      textSize = 14f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }
                  root.addView(card); root.addView(label)
                  return VH(root, card, img, sheen, ring, label, inLabel)
              }

              override fun onBindViewHolder(h: VH, position: Int) {
                  val item = items[position]
                  h.cur = item
                  val d = h.card.resources.displayMetrics.density
                  if (item.isAdd) {
                      val pad = (ch * 0.26f * d).toInt()
                      h.img.setImageResource(R.drawable.ic_add)
                      h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                      h.img.setPadding(pad, pad, pad, pad)
                      h.img.alpha = 1f
                  } else {
                      val banner = item.isBanner && !look.useIcon
                      h.img.setImageDrawable(if (look.useIcon) item.icon else item.image)
                      val ilp = h.img.layoutParams as FrameLayout.LayoutParams
                      ilp.topMargin = if (look.blur) (8 * d).toInt() else 0
                      ilp.bottomMargin = if (look.blur) (30 * d).toInt() else 0
                      h.img.layoutParams = ilp
                      if (look.blur) {
                          val px = (cw * 0.2f * d).toInt()
                          val py = (ch * 0.04f * d).toInt()
                          h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                          h.img.setPadding(px, py, px, py)
                          h.img.alpha = 1f
                      } else if (banner) {
                          h.img.scaleType = ImageView.ScaleType.CENTER_CROP
                          h.img.setPadding(0, 0, 0, 0)
                          h.img.alpha = look.imgAlpha
                      } else {
                          val pad = (ch * 0.2f * d).toInt()
                          h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                          h.img.setPadding(pad, pad, pad, pad)
                          h.img.alpha = 1f
                      }
                  }
                  h.label.text = item.label
                  h.inLabel.text = item.label
                  h.inLabel.visibility = if (look.blur) View.VISIBLE else View.GONE
                  h.label.visibility = if (look.blur || look.labels == 2) View.GONE else View.VISIBLE
                  h.card.animate().cancel()
                  h.card.scaleX = 1f; h.card.scaleY = 1f; h.card.translationZ = 0f; h.card.translationY = 0f
                  h.card.rotationX = 0f; h.card.rotationY = 0f
                  h.sheen.alpha = 0f
                  h.ring.alpha = 0f
                  h.label.alpha = if (look.labels == 1) 1f else 0f

                  h.card.setOnFocusChangeListener { v, focused ->
                      val mv = moving != null && moving == h.cur?.pkg
                      val s = if (focused) look.scale + (if (mv) 0.08f else 0f) else 1f
                      val dur = if (look.anim && look.style != 3) look.dur else 0L
                      val three = look.style == 4
                      val lift = if (focused && (look.style == 2 || three || mv)) -8f * d else 0f
                      val interp: TimeInterpolator = if (look.style == 1) OvershootInterpolator(2.2f) else EASE
                      // 3D pop: the chosen tile lifts towards you, tilts back a little and turns slightly towards the screen centre.
                      var rx = 0f
                      var ry = 0f
                      if (three && focused) {
                          val loc = IntArray(2)
                          v.getLocationOnScreen(loc)
                          val sw = v.resources.displayMetrics.widthPixels.coerceAtLeast(1)
                          val frac = ((loc[0] + v.width / 2f) - sw / 2f) / (sw / 2f)
                          rx = 9f
                          ry = (frac * 12f).coerceIn(-12f, 12f)
                      }
                      v.animate().scaleX(s).scaleY(s).translationY(lift)
                          .rotationX(rx).rotationY(ry)
                          .translationZ(if (focused) (if (three) 30 else 16) * d else 0f)
                          .setInterpolator(interp)
                          .setDuration(dur).start()
                      if (look.sheen) h.sheen.animate().alpha(if (focused) 1f else 0f).setDuration(dur).start()
                      h.ring.animate().alpha(if (focused && (look.ring != 0 || mv)) 1f else 0f).setDuration(dur).start()
                      if (look.labels == 0) h.label.animate().alpha(if (focused) 1f else 0f).setDuration(dur).start()
                  }
                  h.card.setOnClickListener { onOpen(item, h.card) }
                  if (item.isAdd) h.card.setOnLongClickListener(null)
                  else h.card.setOnLongClickListener { onMenu(item); true }
              }

              override fun getItemCount() = items.size
          }
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/CenterLm.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.content.Context
          import android.graphics.Rect
          import android.view.View
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          /**
           * Horizontal row that behaves like a TV carousel:
           *  - at the start of the list the cursor walks from the left edge towards the middle,
           *  - then the cursor stays in the middle and the tiles slide past it,
           *  - at the end of the list the tiles stop and the cursor walks on to the last tile at the right edge.
           * All of that falls out of one rule: scroll so the focused tile is centred, but never scroll past either end.
           */
          class CenterLm(ctx: Context, private val look: Look) : LinearLayoutManager(ctx, RecyclerView.HORIZONTAL, false) {

              // Keep a few tiles ready off-screen so D-pad moves and the slide animation never wait for a tile to be built.
              override fun calculateExtraLayoutSpace(state: RecyclerView.State, extraLayoutSpace: IntArray) {
                  super.calculateExtraLayoutSpace(state, extraLayoutSpace)
                  val w = width
                  extraLayoutSpace[0] = maxOf(extraLayoutSpace[0], w / 2)
                  extraLayoutSpace[1] = maxOf(extraLayoutSpace[1], w / 2)
              }

              /** How far (px) the row must scroll so that [child] ends up centred, respecting both ends of the list. */
              private fun targetDx(rv: RecyclerView, child: View): Int {
                  val n = itemCount
                  val pos = getPosition(child)
                  if (pos < 0 || n == 0 || child.width <= 0 || rv.width <= 0) return 0
                  val lp = child.layoutParams as RecyclerView.LayoutParams
                  val step = child.width + lp.leftMargin + lp.rightMargin
                  val padL = rv.paddingLeft
                  val padR = rv.paddingRight
                  val viewW = rv.width
                  val cur = padL + pos * step + lp.leftMargin - child.left              // where the row is scrolled to now
                  val contentEnd = padL + n * step - lp.rightMargin                       // right edge of the last tile
                  val maxScroll = maxOf(0, contentEnd - (viewW - padR))
                  val childCenter = padL + pos * step + lp.leftMargin + child.width / 2
                  val want = (childCenter - viewW / 2).coerceIn(0, maxScroll)
                  return want - cur
              }

              override fun requestChildRectangleOnScreen(
                  parent: RecyclerView, child: View, rect: Rect, immediate: Boolean, focusedChildVisible: Boolean
              ): Boolean {
                  if (!look.centered) return super.requestChildRectangleOnScreen(parent, child, rect, immediate, focusedChildVisible)
                  val dx = targetDx(parent, child)
                  if (dx == 0) return false
                  if (immediate || !look.anim || look.scrollMs <= 0L) parent.scrollBy(dx, 0)
                  else parent.smoothScrollBy(dx, 0, EASE, look.scrollMs.toInt())
                  return true
              }

              /** Slide the row so [child] is centred (used after a tile has been moved). */
              fun settle(rv: RecyclerView, child: View) {
                  if (!look.centered) return
                  val dx = targetDx(rv, child)
                  if (dx == 0) return
                  if (!look.anim || look.scrollMs <= 0L) rv.scrollBy(dx, 0)
                  else rv.smoothScrollBy(dx, 0, EASE, look.scrollMs.toInt())
              }

              /** Jump (no animation) so the tile at [pos] sits in the middle; the manager clamps this at both ends. */
              fun jumpCentered(rv: RecyclerView, pos: Int, itemPx: Int) {
                  scrollToPositionWithOffset(pos, (rv.width - itemPx) / 2)
              }
          }
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/Blur.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.widget.LinearLayout

          /**
           * Frosted-glass bar. Draws a blurred copy of the wallpaper that sits exactly behind the bar,
           * then a dark translucent tint and a thin light edge. Works on every Android version
           * because the blur is done on the (small) wallpaper bitmap, not on the live screen.
           */
          class BlurPanel(ctx: Context) : LinearLayout(ctx) {
              var blurOn = false
                  set(v) { field = v; invalidate() }
              var blurBmp: Bitmap? = null
                  set(v) { field = v; invalidate() }
              var radiusPx = 0f
              private val bmpP = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val lineP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 2f; color = 0x33FFFFFF }
              private val path = Path()
              private val src = Rect()
              private val dst = RectF()

              init { setWillNotDraw(false) }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  if (!blurOn) return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  dst.set(0f, 0f, w, h)
                  path.reset()
                  path.addRoundRect(dst, radiusPx, radiusPx, Path.Direction.CW)
                  c.save()
                  c.clipPath(path)
                  val b = blurBmp
                  if (b != null) {
                      val loc = IntArray(2)
                      getLocationInWindow(loc)
                      val rw = rootView.width.coerceAtLeast(1)
                      val rh = rootView.height.coerceAtLeast(1)
                      val sx = b.width.toFloat() / rw
                      val sy = b.height.toFloat() / rh
                      val l = (loc[0] * sx).toInt().coerceIn(0, b.width - 1)
                      val t = (loc[1] * sy).toInt().coerceIn(0, b.height - 1)
                      val r = ((loc[0] + w) * sx).toInt().coerceIn(l + 1, b.width)
                      val bt = ((loc[1] + h) * sy).toInt().coerceIn(t + 1, b.height)
                      src.set(l, t, r, bt)
                      c.drawBitmap(b, src, dst, bmpP)
                      fillP.color = 0x8C121A1E.toInt()
                  } else {
                      fillP.color = 0xCC141C20.toInt()
                  }
                  c.drawRect(dst, fillP)
                  c.restore()
                  c.drawPath(path, lineP)
              }
          }

          object Blur {
              /** Returns a small, heavily blurred copy of [src] (screen aligned). [radius] is in pixels of the small copy. */
              fun blurred(src: Bitmap, radius: Int): Bitmap {
                  val w = maxOf(32, src.width / 8)
                  val h = maxOf(18, src.height / 8)
                  val small = Bitmap.createScaledBitmap(src, w, h, true).copy(Bitmap.Config.ARGB_8888, true)!!
                  var a = IntArray(w * h)
                  var b = IntArray(w * h)
                  small.getPixels(a, 0, w, 0, 0, w, h)
                  for (i in 0 until 3) {
                      pass(a, b, w, h, radius, true)
                      pass(b, a, w, h, radius, false)
                  }
                  small.setPixels(a, 0, w, 0, 0, w, h)
                  return small
              }

              private fun pass(s: IntArray, d: IntArray, w: Int, h: Int, r: Int, horiz: Boolean) {
                  val len = if (horiz) w else h
                  val lines = if (horiz) h else w
                  val win = 2 * r + 1
                  for (l in 0 until lines) {
                      var sr = 0
                      var sg = 0
                      var sb = 0
                      for (k in -r..r) {
                          val p = s[at(l, k.coerceIn(0, len - 1), w, horiz)]
                          sr += (p shr 16) and 255; sg += (p shr 8) and 255; sb += p and 255
                      }
                      for (i in 0 until len) {
                          d[at(l, i, w, horiz)] = (0xFF shl 24) or ((sr / win) shl 16) or ((sg / win) shl 8) or (sb / win)
                          val add = s[at(l, minOf(i + r + 1, len - 1), w, horiz)]
                          val sub = s[at(l, maxOf(i - r, 0), w, horiz)]
                          sr += ((add shr 16) and 255) - ((sub shr 16) and 255)
                          sg += ((add shr 8) and 255) - ((sub shr 8) and 255)
                          sb += (add and 255) - (sub and 255)
                      }
                  }
              }

              private fun at(line: Int, i: Int, w: Int, horiz: Boolean): Int = if (horiz) line * w + i else i * w + line
          }
