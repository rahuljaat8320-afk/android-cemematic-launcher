          import android.app.AlertDialog
          import android.bluetooth.BluetoothAdapter
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.graphics.drawable.StateListDrawable
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.TextUtils
          import android.text.format.DateFormat
          import android.util.StateSet
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Collections
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors

          class MI(val label: String, val value: (() -> String)? = null, val keep: Boolean = false, val run: () -> Unit)

          class MainActivity : Activity() {

              private lateinit var store: Store
              private val look = Look()
              private lateinit var root: FrameLayout
              private lateinit var content: FrameLayout
              private var overlay: View? = null
              private var focusBefore: View? = null

              private lateinit var clock: TextView
              private lateinit var date: TextView
              private lateinit var greeting: TextView
              private lateinit var heroBox: View
              private lateinit var chipAvatar: TextView
              private lateinit var chipName: TextView
              private lateinit var chipMail: TextView
              private lateinit var wifiPill: View
              private lateinit var btPill: View
              private lateinit var wifiStatusTv: TextView
              private lateinit var btStatusTv: TextView
              private lateinit var rowR: RecyclerView
              private lateinit var row1: RecyclerView
              private lateinit var row2: RecyclerView
              private lateinit var aR: AppAdapter
              private lateinit var a1: AppAdapter
              private lateinit var a2: AppAdapter
              private lateinit var glowA: GradientDrawable
              private lateinit var glowB: GradientDrawable
              private lateinit var baseBg: ColorDrawable
              private lateinit var bgImageView: ImageView
              private lateinit var statsBox: LinearLayout
              private lateinit var cpuTv: TextView
              private lateinit var cpuBar: ProgressBar
              private lateinit var ramTv: TextView
              private lateinit var ramBar: ProgressBar
              private lateinit var gpuTv: TextView
              private lateinit var gpuBar: ProgressBar
              private var prevTotal = 0L
              private var prevIdle = 0L
              private var cpuApprox = false
              private var gpuApprox = false
              private val statsTick = object : Runnable { override fun run() { updateStats(); handler.postDelayed(this, 2000) } }
              private var focusPending = true

              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val defaultTint = 0xFF3B4CCA.toInt()
              private val accents = arrayOf<Int?>(
                  null, 0xFF3B82F6.toInt(), 0xFF8B5CF6.toInt(), 0xFFEF4444.toInt(),
                  0xFF22C55E.toInt(), 0xFFF59E0B.toInt(), 0xFFEC4899.toInt(), 0xFF14B8A6.toInt()
              )
              private val avatarColors = intArrayOf(0xFF3B4CCA.toInt(), 0xFF0F9D7A.toInt(), 0xFFD9480F.toInt(), 0xFF9C36B5.toInt(), 0xFFC2255C.toInt())
              private var curTint = defaultTint
              private var bgMode = 0
              private var tintAnim: ValueAnimator? = null
              private var master: List<AppItem> = emptyList()
              private var shown: List<AppItem> = emptyList()
              private var splitFirst: AppItem? = null

              private val tick = object : Runnable {
                  override fun run() { updateTime(); refreshToggles(); handler.postDelayed(this, 15_000) }
              }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { loadApps() }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(m: String) { Toast.makeText(this, m, Toast.LENGTH_SHORT).show() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = Store(this)
                  val dm = resources.displayMetrics
                  fun glow(cx: Float, cy: Float, r: Float) = GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      setGradientCenter(cx, cy)
                      gradientRadius = r
                  }
                  glowA = glow(0.18f, 0.05f, dm.widthPixels * 0.8f)
                  glowB = glow(0.95f, 0.6f, dm.widthPixels * 0.6f)
                  baseBg = ColorDrawable(0xFF05060B.toInt())
                  
                  bgImageView = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  root = FrameLayout(this).apply {
                      addView(bgImageView, FrameLayout.LayoutParams(-1, -1))
                      background = LayerDrawable(arrayOf(baseBg, glowA, glowB))
                  }
                  content = FrameLayout(this).apply { clipChildren = false }
                  root.addView(content, FrameLayout.LayoutParams(-1, -1))
                  
                  buildTopBarAndClock()
                  buildHeroAndStats()
                  buildRows()
                  setContentView(root)
                  applyLook()
              }

              private fun pillBg(r: Int): Drawable {
                  val focusColor = if (look.glassMode) 0x77FFFFFF else 0x66FFFFFF
                  val normalColor = if (look.glassMode) 0x60202636.toInt() else 0x22FFFFFF
                  return StateListDrawable().apply {
                      addState(intArrayOf(android.R.attr.state_focused), GradientDrawable().apply { setColor(focusColor); cornerRadius = dp(r).toFloat() })
                      addState(StateSet.WILD_CARD, GradientDrawable().apply { setColor(normalColor); cornerRadius = dp(r).toFloat() })
                  }
              }

              private fun zoomOnFocus(v: View) {
                  v.setOnFocusChangeListener { view, f -> 
                      view.animate().scaleX(if (f) 1.08f else 1f).scaleY(if (f) 1.08f else 1f).setDuration(120).start() 
                  }
              }

              // Logo-based toggle pill for Wi-Fi and Bluetooth
              private fun logoPill(isWifi: Boolean, labelText: String, onLong: (() -> Unit)? = null, click: () -> Unit): View {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(6), dp(14), dp(6))
                      isFocusable = true
                      background = pillBg(20)
                  }
                  zoomOnFocus(container)
                  container.setOnClickListener { click() }
                  if (onLong != null) container.setOnLongClickListener { onLong(); true }

                  val iconView = ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(20), dp(20))
                      setColorFilter(Color.WHITE)
                      setImageResource(if (isWifi) android.R.drawable.ic_menu_upload else android.R.drawable.ic_menu_manage)
                  }
                  val tv = TextView(this).apply {
                      text = labelText
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setPadding(dp(8), 0, 0, 0)
                  }
                  if (isWifi) wifiStatusTv = tv else btStatusTv = tv
                  container.addView(iconView)
                  container.addView(tv)
                  return container
              }

              private fun textPill(label: String, onLong: (() -> Unit)? = null, click: () -> Unit): TextView {
                  val t = TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      isFocusable = true
                      background = pillBg(20)
                  }
                  zoomOnFocus(t)
                  t.setOnClickListener { click() }
                  if (onLong != null) t.setOnLongClickListener { onLong(); true }
                  return t
              }

              private fun buildTopBarAndClock() {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      clipChildren = false
                      setPadding(dp(64), dp(22), dp(64), 0)
                  }
                  
                  // Left Side Profile Chip
                  val chip = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(6), dp(16), dp(6))
                      isFocusable = true
                      background = pillBg(30)
                  }
                  zoomOnFocus(chip)
                  chip.setOnClickListener { profileMenu() }
                  chipAvatar = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(defaultTint) }
                  }
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), 0, 0, 0) }
                  chipName = TextView(this).apply { setTextColor(Color.WHITE); textSize = 14f; typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL) }
                  chipMail = TextView(this).apply {
                      setTextColor(0x99FFFFFF.toInt()); textSize = 11f; maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END; maxWidth = dp(140)
                  }
                  col.addView(chipName); col.addView(chipMail)
                  chip.addView(chipAvatar, LinearLayout.LayoutParams(dp(36), dp(36)))
                  chip.addView(col)
                  bar.addView(chip)

                  // Left-aligned Quick Settings Toggles (Wi-Fi, Bluetooth, Audio, Video, Customize)
                  wifiPill = logoPill(true, "Wi-Fi") { toggleWifi() }
                  btPill = logoPill(false, "Bluetooth") { toggleBt() }
                  val audioPill = textPill("Audio", { pickSettingsPage("audio") }) { openShortcut("audio") }
                  val videoPill = textPill("Video", { pickSettingsPage("video") }) { openShortcut("video") }
                  val customPill = textPill("Customize") { customize() }

                  val leftToggles = listOf(wifiPill, btPill, audioPill, videoPill, customPill)
                  for (p in leftToggles) {
                      bar.addView(p, LinearLayout.LayoutParams(-2, -2).apply { marginStart = dp(10) })
                  }

                  // Spacer pushing Time and Date to the RIGHT corner
                  bar.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))

                  // Right-corner Time and Date Block
                  val rightCornerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.END
                  }
                  clock = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 22f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      gravity = Gravity.END
                  }
                  date = TextView(this).apply {
                      setTextColor(0x99FFFFFF.toInt())
                      textSize = 12f
                      gravity = Gravity.END
                  }
                  rightCornerLayout.addView(clock)
                  rightCornerLayout.addView(date)
                  bar.addView(rightCornerLayout)

                  content.addView(bar, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))
              }

