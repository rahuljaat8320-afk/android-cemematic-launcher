          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("cine", Context.MODE_PRIVATE)

              // One-time clean-up of settings that no longer exist / changed defaults (glass mode removed, tiles now blend).
              fun migrate() {
                  if (sp.getString("g.ver", "") == "2") return
                  val a = profiles()
                  val e = sp.edit()
                  for (i in 0 until a.length()) {
                      val id = a.getJSONObject(i).getString("id")
                      for (k in listOf("tcolor", "topac", "glass", "gtr", "gblur", "gedge", "aurora", "aurstr")) e.remove(id + "." + k)
                  }
                  e.putString("g.ver", "2").apply()
              }

              var cur: String
                  get() = sp.getString("cur", "p1") ?: "p1"
                  set(v) { sp.edit().putString("cur", v).apply() }

              fun profiles(): JSONArray {
                  val s = sp.getString("profiles", null)
                  if (s == null) {
                      val a = JSONArray().put(JSONObject().put("id", "p1").put("name", "Me").put("email", ""))
                      saveProfiles(a)
                      return a
                  }
                  return JSONArray(s)
              }

              fun saveProfiles(a: JSONArray) { sp.edit().putString("profiles", a.toString()).apply() }

              fun profile(): JSONObject {
                  val a = profiles()
                  for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == cur) return a.getJSONObject(i)
                  return a.getJSONObject(0)
              }

              fun update(f: (JSONObject) -> Unit) {
                  val id = profile().getString("id")
                  val a = profiles()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") == id) f(o)
                  }
                  saveProfiles(a)
              }

              fun addProfile(name: String) {
                  val a = profiles()
                  val id = "p" + System.currentTimeMillis()
                  a.put(JSONObject().put("id", id).put("name", name).put("email", ""))
                  saveProfiles(a)
                  cur = id
              }

              fun deleteCurrent() {
                  val a = profiles()
                  if (a.length() < 2) return
                  val id = profile().getString("id")
                  val n = JSONArray()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") != id) n.put(o)
                  }
                  saveProfiles(n)
                  cur = n.getJSONObject(0).getString("id")
              }

              fun get(k: String, d: String): String = sp.getString(profile().getString("id") + "." + k, d) ?: d
              fun put(k: String, v: String) { sp.edit().putString(profile().getString("id") + "." + k, v).apply() }
              fun gget(k: String): String = sp.getString("g." + k, "") ?: ""
              fun gput(k: String, v: String) { sp.edit().putString("g." + k, v).apply() }
              fun list(k: String): List<String> = get(k, "").split(",").filter { it.isNotEmpty() }

              fun sel(key: String): Int {
                  val o = OPT.getValue(key)
                  return (get(key, o.def.toString()).toIntOrNull() ?: o.def).coerceIn(0, o.choices.size - 1)
              }

              fun n(key: String): Int {
                  val o = OPT.getValue(key)
                  return o.from + sel(key) * o.step
              }
          }
