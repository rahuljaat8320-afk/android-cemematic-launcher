name: Build Cine Launcher APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'CINE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.cine.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.cine.launcher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          CINE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.xiaomi.mitv.settings" />
                  <package android:name="com.android.tv.settings" />
                  <package android:name="com.android.settings" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:label="Cine Launcher"
                  android:theme="@style/Theme.Cine">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:resumeWhilePausing="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/Prefs.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class Look {
              var radius = 18
              var scale = 1.13f
              var sheen = true
              var labels = 0
              var anim = true
              var glassMode = false
          }

          class Opt(val key: String, val title: String, val choices: List<String>, val def: Int)

          val OPTS = listOf(
              Opt("accent", "Glow color", listOf("Auto (Wallpaper/Icon)", "Blue", "Purple", "Red", "Green", "Orange", "Pink", "Teal"), 0),
              Opt("bg", "Background Mode", listOf("Aurora Gradient", "Solid Dark", "Pure Black", "Custom Wallpaper"), 0),
              Opt("aurora_blend", "Aurora Overlay", listOf("Off", "Blend with Background"), 1),
              Opt("glass", "Glass Mode (Translucency)", listOf("Off", "Enabled (70%-80% Glass)"), 0),
              Opt("layout", "Layout Style", listOf("Top row + apps", "Two rows", "Single row"), 0),
              Opt("toprow", "Top row content", listOf("Recent apps", "Off"), 0),
              Opt("stats", "System Stats (CPU/RAM/GPU)", listOf("Show", "Hide"), 0),
              Opt("size", "Tile Size", listOf("Small", "Medium", "Large"), 1),
              Opt("count", "Tiles per row", listOf("4", "6", "8", "10", "12"), 2),
              Opt("corner", "Tile Shape / Corners", listOf("Square", "Rounded", "Round"), 1),
              Opt("focus", "Focus Zoom", listOf("Subtle", "Normal", "Big"), 1),
              Opt("sheen", "Focus Shine", listOf("On", "Off"), 0),
              Opt("labels", "App Labels", listOf("On focus", "Always", "Hidden"), 0),
              Opt("sort", "Sort order", listOf("A to Z", "Z to A"), 0),
              Opt("clock", "Header greeting", listOf("Show", "Hide"), 0),
              Opt("greet", "Greeting text", listOf("Show", "Hide"), 0),
              Opt("anim", "Animations", listOf("On", "Off"), 0)
          )

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("cine", Context.MODE_PRIVATE)

              var cur: String
                  get() = sp.getString("cur", "p1") ?: "p1"
                  set(v) { sp.edit().putString("cur", v).apply() }

              fun profiles(): JSONArray {
                  val s = sp.getString("profiles", null)
                  if (s == null) {
                      val a = JSONArray().put(JSONObject().put("id", "p1").put("name", "Me").put("email", ""))
                      saveProfiles(a)
                      return a
                  }
                  return JSONArray(s)
              }

              fun saveProfiles(a: JSONArray) { sp.edit().putString("profiles", a.toString()).apply() }

              fun profile(): JSONObject {
                  val a = profiles()
                  for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == cur) return a.getJSONObject(i)
                  return a.getJSONObject(0)
              }

              fun update(f: (JSONObject) -> Unit) {
                  val id = profile().getString("id")
                  val a = profiles()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") == id) f(o)
                  }
                  saveProfiles(a)
              }

              fun addProfile(name: String) {
                  val a = profiles()
                  val id = "p" + System.currentTimeMillis()
                  a.put(JSONObject().put("id", id).put("name", name).put("email", ""))
                  saveProfiles(a)
                  cur = id
              }

              fun deleteCurrent() {
                  val a = profiles()
                  if (a.length() < 2) return
                  val id = profile().getString("id")
                  val n = JSONArray()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.getString("id") != id) n.put(o)
                  }
                  saveProfiles(n)
                  cur = n.getJSONObject(0).getString("id")
              }

              fun get(k: String, d: String): String = sp.getString(profile().getString("id") + "." + k, d) ?: d
              fun put(k: String, v: String) { sp.edit().putString(profile().getString("id") + "." + k, v).apply() }
              fun gget(k: String): String = sp.getString("g." + k, "") ?: ""
              fun gput(k: String, v: String) { sp.edit().putString("g." + k, v).apply() }
              fun list(k: String): List<String> = get(k, "").split(",").filter { it.isNotEmpty() }

              fun sel(key: String): Int {
                  val o = OPTS.firstOrNull { it.key == key } ?: return 0
                  return (get(key, o.def.toString()).toIntOrNull() ?: o.def).coerceIn(0, o.choices.size - 1)
              }
          }
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/AppAdapter.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          data class AppItem(
              val label: String,
              val pkg: String,
              val intent: Intent,
              val image: Drawable,
              val isBanner: Boolean,
              val tint: Int?,
              val lean: Boolean,
              val badge: String? = null,
              val meta: String? = null,
              val overview: String? = null
          )

          class AppAdapter(
              private val look: Look,
              private val onFocus: (AppItem) -> Unit,
              private val onOpen: (AppItem) -> Unit,
              private val onMenu: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {

              var items: List<AppItem> = emptyList()
              var cw = 208
              var ch = 117

              class VH(
                  val root: LinearLayout, val card: FrameLayout, val img: ImageView,
                  val sheen: View, val badge: TextView, val label: TextView
              ) : RecyclerView.ViewHolder(root)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val c = parent.context
                  val d = c.resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()
                  val radius = dp(look.radius).toFloat()

                  val cardBgStart = if (look.glassMode) 0xB01C2233.toInt() else 0xFF262C3D.toInt()
                  val cardBgEnd = if (look.glassMode) 0x80141824.toInt() else 0xFF141824.toInt()

                  val root = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      clipChildren = false
                      layoutParams = RecyclerView.LayoutParams(dp(cw), -2).apply { marginEnd = dp(22) }
                  }
                  val card = FrameLayout(c).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(cw), dp(ch))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR, intArrayOf(cardBgStart, cardBgEnd)
                      ).apply { cornerRadius = radius }
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, o: Outline) { o.setRoundRect(0, 0, v.width, v.height, radius) }
                      }
                      clipToOutline = true
                      isFocusable = true
                      isFocusableInTouchMode = false
                  }
                  val img = ImageView(c).apply { layoutParams = FrameLayout.LayoutParams(-1, -1) }
                  val sheen = View(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(0x55FFFFFF, 0x10FFFFFF, 0x00FFFFFF)
                      )
                      alpha = 0f
                  }
                  val badge = TextView(c).apply {
                      layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START).apply { topMargin = dp(6); marginStart = dp(6) }
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setPadding(dp(6), dp(2), dp(6), dp(2))
                      background = GradientDrawable().apply { setColor(0xCC000000.toInt()); cornerRadius = dp(6).toFloat() }
                      visibility = View.GONE
                  }
                  card.addView(img); card.addView(sheen); card.addView(badge)

                  val label = TextView(c).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) }
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }
                  root.addView(card); root.addView(label)
                  return VH(root, card, img, sheen, badge, label)
              }

              override fun onBindViewHolder(h: VH, position: Int) {
                  val item = items[position]
                  val d = h.card.resources.displayMetrics.density
                  h.img.setImageDrawable(item.image)
                  if (item.isBanner) {
                      h.img.scaleType = ImageView.ScaleType.CENTER_CROP
                      h.img.setPadding(0, 0, 0, 0)
                  } else {
                      val pad = (ch * 0.2f * d).toInt()
                      h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                      h.img.setPadding(pad, pad, pad, pad)
                  }
                  h.label.text = item.label
                  if (item.badge != null) { h.badge.text = item.badge; h.badge.visibility = View.VISIBLE } else h.badge.visibility = View.GONE
                  h.label.visibility = if (look.labels == 2) View.GONE else View.VISIBLE
                  h.card.scaleX = 1f; h.card.scaleY = 1f; h.card.translationZ = 0f
                  h.sheen.alpha = 0f
                  h.label.alpha = if (look.labels == 1) 1f else 0f

                  h.card.setOnFocusChangeListener { v, focused ->
                      val s = if (focused) look.scale else 1f
                      val dur = if (look.anim) 160L else 0L
                      v.animate().scaleX(s).scaleY(s).translationZ(if (focused) 28 * d else 0f).setDuration(dur).start()
                      if (look.sheen) h.sheen.animate().alpha(if (focused) 1f else 0f).setDuration(dur).start()
                      if (look.labels == 0) h.label.animate().alpha(if (focused) 1f else 0f).setDuration(dur).start()
                      if (focused) onFocus(item)
                  }
                  h.card.setOnClickListener { onOpen(item) }
                  h.card.setOnLongClickListener { onMenu(item); true }
              }

              override fun getItemCount() = items.size
          }
          CINE_EOF
          mkdir -p app/src/main/java/com/cine/launcher
          cat > app/src/main/java/com/cine/launcher/MainActivity.kt <<'CINE_EOF'
          package com.cine.launcher

          import android.Manifest
          import android.app.ActivityManager
          import android.content.res.ColorStateList
          import android.graphics.BitmapFactory
          import android.graphics.Paint
          import android.graphics.drawable.BitmapDrawable
          import android.widget.ProgressBar
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import android.accounts.AccountManager
          import android.animation.ArgbEvaluator
