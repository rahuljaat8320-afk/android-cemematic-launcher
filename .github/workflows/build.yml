                      for (o in OPTS) if (o.group == group) store.put(o.key, o.def.toString())
                      applyLook()
                      section(title, group, head)
                  })
                  showMenu(title + "   (\u25C0 \u25B6 to adjust)", items, back = { customize() }, side = true)
              }

