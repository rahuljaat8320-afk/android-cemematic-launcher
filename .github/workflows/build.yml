                  catch (e: Exception) {
                      try { startActivity(Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                      catch (e2: Exception) { toast("Settings aren't available") }
                  }
              }

              private fun appMenu(app: AppItem) {
                  if (app.pkg.startsWith("rec:")) { recMenu(app); return }
                  val pk = app.pkg
                  val uri = Uri.parse("package:" + pk)
                  val items = arrayListOf(
                      MI("Open") { launchApp(app) },
                      MI("Pin to front") { saveOrder(listOf(pk) + shown.map { it.pkg }.filter { it != pk }) },
                      MI("Move left") { move(pk, -1) },
                      MI("Move right") { move(pk, 1) },
                      MI("Hide from home") { store.put("hidden", (store.list("hidden") + pk).joinToString(",")); render() },
                      MI("Open side by side with…") { startSplit(app) },
                      MI("App info") { startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) },
                      MI("Uninstall") { startActivity(Intent(Intent.ACTION_DELETE, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                  )
                  showMenu(app.label, items)
              }

