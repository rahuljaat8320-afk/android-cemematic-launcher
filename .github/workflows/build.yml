              // ---------- customization menus ----------
              private fun optItems(group: String): ArrayList<MI> {
                  val items = ArrayList<MI>()
                  for (o in OPTS) {
                      if (o.group != group) continue
                      val n = o.choices.size
                      items.add(MI(o.title, value = { o.choices[store.sel(o.key)] }, keep = true,
                          adj = { dir -> store.put(o.key, ((store.sel(o.key) + dir + n) % n).toString()); applyLook() }) {
                          store.put(o.key, ((store.sel(o.key) + 1) % n).toString())
                          applyLook()
                      })
                  }
                  return items
              }

