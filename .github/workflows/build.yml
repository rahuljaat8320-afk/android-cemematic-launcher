          )

          class MainActivity : Activity() {

              private lateinit var store: Store
              private val look = Look()
              private lateinit var root: FrameLayout
              private lateinit var wallView: ImageView
              private lateinit var scrim: View
              private lateinit var auroraView: View
              private lateinit var content: FrameLayout
              private var overlay: View? = null
              private var focusBefore: View? = null
              private var menuBack: (() -> Unit)? = null

              private lateinit var clock: TextView
              private lateinit var date: TextView
              private lateinit var clockBox: LinearLayout
              private lateinit var btnBar: LinearLayout
              private lateinit var profBtn: TextView
              private lateinit var wifiBtn: ImageView
              private lateinit var btBtn: ImageView
              private lateinit var audBtn: ImageView
              private lateinit var vidBtn: ImageView
              private lateinit var moreBtn: ImageView
              private lateinit var setBtn: ImageView
              private lateinit var rowR: RecyclerView
              private lateinit var row1: RecyclerView
              private lateinit var row2: RecyclerView
              private lateinit var aR: AppAdapter
              private lateinit var a1: AppAdapter
              private lateinit var a2: AppAdapter
              private lateinit var glowA: GradientDrawable
              private lateinit var glowB: GradientDrawable
              private lateinit var baseBg: ColorDrawable
              private lateinit var statsBox: LinearLayout
              private lateinit var cpuTile: LinearLayout
              private lateinit var ramTile: LinearLayout
              private lateinit var gpuTile: LinearLayout
              private lateinit var cpuTv: TextView
              private lateinit var cpuBar: ProgressBar
              private lateinit var ramTv: TextView
              private lateinit var ramBar: ProgressBar
              private lateinit var gpuTv: TextView
              private lateinit var gpuBar: ProgressBar

              private var focusPending = true
              private var launchedAway = false
              private var prevTotal = 0L
              private var prevIdle = 0L
              private var cpuApprox = false
              private var gpuApprox = false
              private var avatarCol = 0xFF3B4CCA.toInt()

              private var wallBase: Bitmap? = null
              private var wallKey = ""
              private var wallTint = 0xFF4F7CFF.toInt()
              private var bdBmp: Bitmap? = null
              private var bdKey = ""

              private val statsTick = object : Runnable { override fun run() { updateStats(); handler.postDelayed(this, 2000) } }
              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val defaultTint = 0xFF3B4CCA.toInt()
              private val accents = arrayOf<Int?>(
                  null, 0xFF3B82F6.toInt(), 0xFF8B5CF6.toInt(), 0xFFEF4444.toInt(),
                  0xFF22C55E.toInt(), 0xFFF59E0B.toInt(), 0xFFEC4899.toInt(), 0xFF14B8A6.toInt()
              )
              private val avatarColors = intArrayOf(0xFF3B4CCA.toInt(), 0xFF0F9D7A.toInt(), 0xFFD9480F.toInt(), 0xFF9C36B5.toInt(), 0xFFC2255C.toInt())
              private var curTint = defaultTint
              private var tintAnim: ValueAnimator? = null
              private var master: List<AppItem> = emptyList()
              private var shown: List<AppItem> = emptyList()
              private var splitFirst: AppItem? = null

              private val tick = object : Runnable {
                  override fun run() { updateTime(); refreshToggles(); handler.postDelayed(this, 15_000) }
              }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { loadApps() }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(m: String) { Toast.makeText(this, m, Toast.LENGTH_SHORT).show() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = Store(this)
                  val dm = resources.displayMetrics
                  fun glow(cx: Float, cy: Float, r: Float) = GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      setGradientCenter(cx, cy)
                      gradientRadius = r
                      colors = intArrayOf(0, 0)
                  }
                  glowA = glow(0.18f, 0.05f, dm.widthPixels * 0.8f)
                  glowB = glow(0.95f, 0.6f, dm.widthPixels * 0.6f)
                  baseBg = ColorDrawable(0xFF05060B.toInt())
                  root = FrameLayout(this).apply { background = baseBg }
                  wallView = ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_XY }
                  scrim = View(this)
                  auroraView = View(this).apply { background = LayerDrawable(arrayOf<Drawable>(glowA, glowB)) }
                  content = FrameLayout(this).apply { clipChildren = false }
                  root.addView(wallView, FrameLayout.LayoutParams(-1, -1))
                  root.addView(scrim, FrameLayout.LayoutParams(-1, -1))
                  root.addView(auroraView, FrameLayout.LayoutParams(-1, -1))
                  root.addView(content, FrameLayout.LayoutParams(-1, -1))
                  buildTop()
                  buildStats()
                  buildRows()
                  setContentView(root)
                  applyLook()
              }

              // ---------- UI building ----------
              private fun pillBg(r: Int) = StateListDrawable().apply {
                  addState(intArrayOf(android.R.attr.state_focused), GradientDrawable().apply { setColor(0x66FFFFFF); cornerRadius = dp(r).toFloat() })
                  addState(StateSet.WILD_CARD, GradientDrawable().apply { setColor(0x22FFFFFF); cornerRadius = dp(r).toFloat() })
              }

              private fun zoomOnFocus(v: View) {
                  v.setOnFocusChangeListener { view, f ->
                      val z = if (f) store.n("bzoom") / 100f else 1f
                      val d = if (look.anim) look.dur else 0L
                      view.animate().scaleX(z).scaleY(z).setDuration(d).start()
                      (view.background as? TileBg)?.let { it.boost = if (f) 0.2f else 0f; it.ring = f; view.invalidate() }
                  }
              }

              private fun iconBtn(res: Int, desc: String, onLong: (() -> Unit)? = null, click: () -> Unit): ImageView {
                  val v = ImageView(this)
                  v.setImageResource(res)
                  v.contentDescription = desc
                  v.isFocusable = true
                  v.setColorFilter(Color.WHITE)
                  zoomOnFocus(v)
                  v.setOnClickListener { click() }
                  if (onLong != null) v.setOnLongClickListener { onLong(); true }
                  return v
              }

              private fun buildTop() {
                  btnBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      clipChildren = false
                  }
                  profBtn = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      isFocusable = true
                      contentDescription = "Profile"
                      setOnClickListener { profileMenu() }
                  }
                  zoomOnFocus(profBtn)
                  wifiBtn = iconBtn(R.drawable.ic_btn_wifi, "Wi-Fi", { pickSettingsPage("wifi") }) { toggleWifi() }
                  btBtn = iconBtn(R.drawable.ic_btn_bt, "Bluetooth", { pickSettingsPage("bt") }) { toggleBt() }
                  audBtn = iconBtn(R.drawable.ic_btn_audio, "Audio", { pickSettingsPage("audio") }) { openShortcut("audio") }
                  vidBtn = iconBtn(R.drawable.ic_btn_video, "Video", { pickSettingsPage("video") }) { openShortcut("video") }
                  moreBtn = iconBtn(R.drawable.ic_btn_more, "More") { quickMenu() }
                  setBtn = iconBtn(R.drawable.ic_btn_tune, "Customize") { customize() }
                  content.addView(btnBar)

                  clock = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setShadowLayer(8f, 0f, 2f, 0x99000000.toInt())
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  date = TextView(this).apply {
                      setTextColor(0xCCFFFFFF.toInt()); textSize = 13f
                      setShadowLayer(8f, 0f, 2f, 0x99000000.toInt())
                  }
                  clockBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  clockBox.addView(clock); clockBox.addView(date)
                  content.addView(clockBox)
              }

              private fun styleTop() {
                  val szN = store.n("bsize")
                  val sz = dp(szN)
                  val gap = dp(store.n("bgap"))
                  val a = if (look.glass) (100 - store.n("gtr")) / 100f else store.n("bopac") / 100f
                  val col = tileColorOf(store.sel("bcolor"))
                  val rad = when (store.sel("bshape")) { 0 -> -1f; 1 -> sz * 0.28f; else -> dp(6).toFloat() }
                  val pad = (sz * 0.26f).toInt()
                  val show = ArrayList<View>()
                  if (store.sel("bprof") == 0) show.add(profBtn)
                  show.add(wifiBtn); show.add(btBtn)
                  if (store.sel("baud") == 0) show.add(audBtn)
                  if (store.sel("bvid") == 0) show.add(vidBtn)
                  if (store.sel("bmore") == 0) show.add(moreBtn)
                  show.add(setBtn)
                  btnBar.removeAllViews()
                  for (v in show) {
                      v.background = if (v === profBtn) TileBg(v, null, -1f, avatarCol, 1f, false, 0f)
                      else TileBg(v, look.backdrop, rad, col, a, look.edge, dp(1).toFloat())
                      if (v is ImageView) v.setPadding(pad, pad, pad, pad)
                      btnBar.addView(v, LinearLayout.LayoutParams(sz, sz).apply { marginEnd = gap })
                  }
                  profBtn.textSize = szN * 0.4f
                  val bp = store.sel("bpos")
                  val g = when (bp) { 0 -> Gravity.START; 1 -> Gravity.CENTER_HORIZONTAL; else -> Gravity.END }
                  btnBar.layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or g).apply {
                      topMargin = dp(18); marginStart = dp(48); marginEnd = dp(48)
                  }

                  val cp = store.sel("cpos")
                  clockBox.visibility = if (cp == 3) View.GONE else View.VISIBLE
                  clock.textSize = store.n("csize").toFloat()
                  date.visibility = if (store.sel("cdate") == 0) View.VISIBLE else View.GONE
                  val cg = when (cp) { 1 -> Gravity.START; 2 -> Gravity.CENTER_HORIZONTAL; else -> Gravity.END }
                  clockBox.gravity = cg
                  val cside = when (cp) { 0 -> 2; 1 -> 0; else -> 1 }
                  val same = cp != 3 && cside == bp
                  clockBox.layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or cg).apply {
                      topMargin = dp(14) + (if (same) sz + dp(8) else 0)
                      marginStart = dp(48); marginEnd = dp(48)
                  }
              }

              private fun statTv() = TextView(this).apply {
                  setTextColor(0xEEFFFFFF.toInt())
                  setShadowLayer(4f, 0f, 1f, 0x66000000)
              }

              private fun statBar(): ProgressBar {
                  val b = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  b.max = 100
                  b.progressBackgroundTintList = ColorStateList.valueOf(0x33FFFFFF)
                  return b
              }

              private fun statTile(tv: TextView, bar: ProgressBar): LinearLayout {
                  val t = LinearLayout(this)
                  t.orientation = LinearLayout.VERTICAL
                  t.addView(tv)
                  t.addView(bar, LinearLayout.LayoutParams(-1, dp(4)).apply { topMargin = dp(6) })
                  return t
              }

              private fun buildStats() {
                  cpuTv = statTv(); ramTv = statTv(); gpuTv = statTv()
                  cpuBar = statBar(); ramBar = statBar(); gpuBar = statBar()
                  cpuTile = statTile(cpuTv, cpuBar)
                  ramTile = statTile(ramTv, ramBar)
                  gpuTile = statTile(gpuTv, gpuBar)
                  statsBox = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  content.addView(statsBox)
              }

              private fun styleStats() {
                  statsBox.visibility = if (store.sel("stats") == 0) View.VISIBLE else View.GONE
                  val w = dp(store.n("sw"))
                  val gap = dp(store.n("sgap"))
                  val pad = dp(10)
                  val a = if (look.glass) (100 - store.n("gtr")) / 100f else store.n("sopac") / 100f
                  val col = tileColorOf(store.sel("scolor"))
                  val rad = if (store.sel("sshape") == 1) -1f else dp(store.n("scorner")).toFloat()
                  statsBox.removeAllViews()
                  val tiles = listOf(cpuTile to "scpu", ramTile to "sram", gpuTile to "sgpu")
                  for ((t, k) in tiles) {
                      if (store.sel(k) != 0) continue
                      t.background = TileBg(t, look.backdrop, rad, col, a, look.edge, dp(1).toFloat())
                      t.setPadding(pad, pad, pad, pad)
                      statsBox.addView(t, LinearLayout.LayoutParams(w, -2).apply { marginEnd = gap })
                  }
                  val ts = store.n("stext").toFloat()
                  cpuTv.textSize = ts; ramTv.textSize = ts; gpuTv.textSize = ts
                  val bc = when (store.sel("sbar")) { 0 -> null; 1 -> themeAccent(); else -> Color.WHITE }
                  cpuBar.progressTintList = ColorStateList.valueOf(bc ?: 0xFF60A5FA.toInt())
                  ramBar.progressTintList = ColorStateList.valueOf(bc ?: 0xFFA78BFA.toInt())
                  gpuBar.progressTintList = ColorStateList.valueOf(bc ?: 0xFF34D399.toInt())
                  val g = when (store.sel("spos")) { 0 -> Gravity.START; 1 -> Gravity.CENTER_HORIZONTAL; else -> Gravity.END }
                  statsBox.layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or g).apply {
                      topMargin = dp(store.n("sy")); marginStart = dp(48); marginEnd = dp(48)
                  }
              }

              private fun buildRows() {
                  val onFocus: (AppItem) -> Unit = { app ->
                      if (!wallOn() && accents[store.sel("accent")] == null) applyTint(app.tint ?: defaultTint)
                  }
                  val onOpen: (AppItem, View) -> Unit = { app, v -> openApp(app, v) }
                  val onMenu: (AppItem) -> Unit = { app -> appMenu(app) }
                  aR = AppAdapter(look, onFocus, onOpen, onMenu)
                  a1 = AppAdapter(look, onFocus, onOpen, onMenu)
                  a2 = AppAdapter(look, onFocus, onOpen, onMenu)
                  fun rowOf(a: AppAdapter) = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity, RecyclerView.HORIZONTAL, false)
                      adapter = a
                      clipToPadding = false
                      clipChildren = false
                      setPadding(dp(48), dp(14), dp(48), dp(14))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      itemAnimator = null
                      addOnScrollListener(object : RecyclerView.OnScrollListener() {
                          override fun onScrolled(rv: RecyclerView, dx: Int, dy: Int) {
                              if (look.glass && look.backdrop != null) {
                                  for (i in 0 until rv.childCount) (rv.getChildAt(i) as ViewGroup).getChildAt(0)?.invalidate()
                              }
                          }
                      })
                  }
                  rowR = rowOf(aR); row1 = rowOf(a1); row2 = rowOf(a2)
                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      clipChildren = false
                      setPadding(0, 0, 0, dp(8))
                  }
                  bottom.addView(rowR, LinearLayout.LayoutParams(-1, -2))
                  bottom.addView(row1, LinearLayout.LayoutParams(-1, -2))
                  bottom.addView(row2, LinearLayout.LayoutParams(-1, -2))
                  content.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
              }

              // ---------- look, wallpaper, theme ----------
              private fun wallFile() = File(filesDir, "wall_" + store.profile().getString("id") + ".jpg")

              private fun wallOn(): Boolean = store.sel("wall") == 1 && wallBase != null

              private fun themeAccent(): Int = accents[store.sel("accent")] ?: if (wallOn()) wallTint else 0xFF4F7CFF.toInt()

              private fun tileColorOf(idx: Int): Int = if (idx == 3) themeAccent() else COLOR_VALS[idx]

              private fun applyLook() {
                  look.glass = store.sel("glass") == 1
                  look.anim = store.sel("anim") == 0
                  prepareBackground()
                  baseBg.color = if (store.sel("bg") == 1) Color.BLACK else 0xFF05060B.toInt()

                  look.radius = store.n("corner")
                  look.circle = store.sel("tshape") == 1
                  look.scale = store.n("focus") / 100f
                  look.sheen = store.sel("sheen") == 0
                  look.labels = store.sel("labels")
                  look.dur = longArrayOf(0, 100, 160, 260, 420)[store.sel("fdur")]
                  look.style = store.sel("fstyle")
                  look.gap = store.n("gap")
                  look.ring = store.sel("ring")
                  look.ringColor = if (look.ring == 2) themeAccent() else Color.WHITE
                  look.useIcon = store.sel("art") == 1
                  val tr = store.n("gtr")
                  look.fillColor = tileColorOf(store.sel("tcolor"))
                  look.fillA = if (look.glass) (100 - tr) / 100f else store.n("topac") / 100f
                  look.edge = look.glass && store.sel("gedge") == 0
                  look.imgAlpha = if (look.glass) 0.45f + 0.55f * (100 - tr) / 100f else 1f

                  val tw = store.n("tw")
                  val small = tw * store.n("rs") / 100
                  val ratio = floatArrayOf(0.5625f, 0.6667f, 0.75f, 1f)[store.sel("asp")]
                  aR.cw = small; aR.ch = (small * ratio).toInt()
                  a1.cw = tw; a1.ch = (tw * ratio).toInt()
                  a2.cw = small; a2.ch = (small * ratio).toInt()
                  for ((r, a) in listOf(rowR to aR, row1 to a1, row2 to a2)) { r.adapter = null; r.adapter = a }

                  refreshProfile()
                  styleTop()
                  styleStats()
                  val fixed = accents[store.sel("accent")]
                  val base = fixed ?: if (wallOn()) wallTint else null
                  if (base != null) applyTint(base) else paintGlow(curTint)
                  updateTime()
                  refreshToggles()
                  render()
              }

              private fun prepareBackground() {
                  val f = wallFile()
                  if (store.sel("wall") != 1 || !f.exists()) { clearWall(); return }
                  val key = f.path + f.lastModified()
                  if (key != wallKey) {
                      wallBase = loadCover(f)
                      wallKey = key
                      bdKey = ""
                      val wb = wallBase
                      if (wb != null) {
                          val s = Bitmap.createScaledBitmap(wb, 32, 18, true)
                          wallTint = dominant(s) ?: 0xFF4F7CFF.toInt()
                          if (s !== wb) s.recycle()
                      }
                  }
                  val base = wallBase
                  if (base == null) { clearWall(); return }
                  wallView.setImageBitmap(base)
                  val dim = store.n("dim")
                  scrim.setBackgroundColor((dim * 255 / 100) shl 24)
                  scrim.visibility = View.VISIBLE
                  if (look.glass) {
                      val lvl = store.sel("gblur")
                      val k2 = key + "|" + dim + "|" + lvl
                      if (k2 != bdKey) { bdBmp = makeBackdrop(base, lvl, dim); bdKey = k2 }
                      look.backdrop = bdBmp
                  } else look.backdrop = null
              }

              private fun clearWall() {
                  wallBase = null; wallKey = ""; bdBmp = null; bdKey = ""
                  wallView.setImageDrawable(null)
                  scrim.visibility = View.GONE
                  look.backdrop = null
              }

              private fun loadCover(f: File): Bitmap? = try {
                  val dm = resources.displayMetrics
                  val tw = dm.widthPixels
                  val th = dm.heightPixels
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(f.path, o)
                  var s = 1
                  while (o.outWidth / (s * 2) >= tw && o.outHeight / (s * 2) >= th) s *= 2
                  val opt = BitmapFactory.Options().apply { inSampleSize = s }
                  val bmp = BitmapFactory.decodeFile(f.path, opt)
                  if (bmp == null) null else {
                      val scale = maxOf(tw.toFloat() / bmp.width, th.toFloat() / bmp.height)
                      val out = Bitmap.createBitmap(tw, th, Bitmap.Config.ARGB_8888)
                      val m = Matrix()
                      m.postScale(scale, scale)
                      m.postTranslate((tw - bmp.width * scale) / 2f, (th - bmp.height * scale) / 2f)
                      Canvas(out).drawBitmap(bmp, m, Paint(Paint.FILTER_BITMAP_FLAG))
                      bmp.recycle()
                      out
                  }
              } catch (e: Exception) { null }

              private fun makeBackdrop(base: Bitmap, lvl: Int, dim: Int): Bitmap {
                  val w = base.width
                  val h = base.height
                  var bmp: Bitmap
                  if (lvl == 0) {
                      bmp = base.copy(Bitmap.Config.ARGB_8888, true)
                  } else {
                      val sw = maxOf(w / 8, 16)
                      val sh = maxOf(h / 8, 9)
                      val small = Bitmap.createScaledBitmap(base, sw, sh, true).copy(Bitmap.Config.ARGB_8888, true)
                      val px = IntArray(sw * sh)
                      small.getPixels(px, 0, sw, 0, 0, sw, sh)
                      val tmp = IntArray(px.size)
                      val r = lvl * 2
                      for (pass in 0 until 2) {
                          blur1d(px, tmp, sh, sw, sw, 1, r)
                          blur1d(tmp, px, sw, sh, 1, sw, r)
                      }
                      small.setPixels(px, 0, sw, 0, 0, sw, sh)
                      bmp = Bitmap.createScaledBitmap(small, w, h, true)
                      if (!bmp.isMutable) bmp = bmp.copy(Bitmap.Config.ARGB_8888, true)
                  }
                  if (dim > 0) Canvas(bmp).drawColor((dim * 255 / 100) shl 24)
                  return bmp
              }

              private fun blur1d(src: IntArray, dst: IntArray, lines: Int, len: Int, lineStep: Int, elemStep: Int, r: Int) {
                  val div = 2 * r + 1
                  for (ln in 0 until lines) {
                      val base = ln * lineStep
                      var ra = 0; var ga = 0; var ba = 0
                      for (i in -r..r) {
                          val p = src[base + i.coerceIn(0, len - 1) * elemStep]
                          ra += (p shr 16) and 255; ga += (p shr 8) and 255; ba += p and 255
                      }
                      for (k in 0 until len) {
                          dst[base + k * elemStep] = (0xFF shl 24) or ((ra / div) shl 16) or ((ga / div) shl 8) or (ba / div)
                          val add = src[base + (k + r + 1).coerceAtMost(len - 1) * elemStep]
                          val sub = src[base + (k - r).coerceAtLeast(0) * elemStep]
                          ra += ((add shr 16) and 255) - ((sub shr 16) and 255)
                          ga += ((add shr 8) and 255) - ((sub shr 8) and 255)
                          ba += (add and 255) - (sub and 255)
                      }
                  }
              }

              private fun refreshProfile() {
                  val p = store.profile()
                  val name = p.getString("name")
                  profBtn.text = name.take(1).uppercase()
                  avatarCol = avatarColors[Math.abs(p.getString("id").hashCode()) % avatarColors.size]
              }

              private fun paintGlow(c: Int) {
                  if (store.sel("aurora") != 0) {
                      glowA.colors = intArrayOf(0, 0); glowB.colors = intArrayOf(0, 0)
                      return
                  }
                  val k = floatArrayOf(0.6f, 1f, 1.5f)[store.sel("aurstr")] * (if (wallOn()) 0.75f else 1f)
                  val al1 = (0x77 * k).toInt().coerceIn(0, 255)
                  val al2 = (0x55 * k).toInt().coerceIn(0, 255)
                  glowA.colors = intArrayOf((c and 0x00FFFFFF) or (al1 shl 24), 0x00000000)
                  val hsv = FloatArray(3)
                  Color.colorToHSV(c, hsv)
                  hsv[0] = (hsv[0] + 50f) % 360f
                  glowB.colors = intArrayOf((Color.HSVToColor(hsv) and 0x00FFFFFF) or (al2 shl 24), 0x00000000)
              }

              private fun applyTint(target: Int) {
                  tintAnim?.cancel()
                  if (!look.anim) { curTint = target; paintGlow(target); return }
                  tintAnim = ValueAnimator.ofObject(ArgbEvaluator(), curTint, target).apply {
                      duration = 400
                      addUpdateListener { curTint = it.animatedValue as Int; paintGlow(curTint) }
                      start()
                  }
              }

              private fun dominant(bmp: Bitmap): Int? {
                  var r = 0.0; var g = 0.0; var b = 0.0; var wSum = 0.0
                  val hsv = FloatArray(3)
                  for (x in 0 until bmp.width) for (y in 0 until bmp.height) {
                      val px = bmp.getPixel(x, y)
                      if (Color.alpha(px) < 128) continue
                      Color.colorToHSV(px, hsv)
                      val w = (hsv[1] * hsv[2]).toDouble() + 0.001
                      r += Color.red(px) * w; g += Color.green(px) * w; b += Color.blue(px) * w; wSum += w
                  }
                  if (wSum <= 0.0) return null
                  val avg = Color.rgb((r / wSum).toInt(), (g / wSum).toInt(), (b / wSum).toInt())
                  Color.colorToHSV(avg, hsv)
                  if (hsv[1] < 0.2f) return null
                  hsv[1] = hsv[1].coerceAtLeast(0.55f)
                  hsv[2] = hsv[2].coerceAtLeast(0.85f)
                  return Color.HSVToColor(hsv)
              }

              private fun tintOf(src: Drawable): Int? = try {
                  val dd = src.constantState?.newDrawable()?.mutate() ?: src
                  val bmp = Bitmap.createBitmap(12, 12, Bitmap.Config.ARGB_8888)
                  dd.setBounds(0, 0, 12, 12)
                  dd.draw(Canvas(bmp))
                  val res = dominant(bmp)
                  bmp.recycle()
                  res
              } catch (e: Exception) { null }

              // ---------- wallpaper picking ----------
              private fun pickWallpaper() {
                  try {
                      startActivityForResult(
                          Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType("image/*"), 78
                      )
                  } catch (e: Exception) {
                      try {
                          startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).setType("image/*"), 78)
                      } catch (e2: Exception) { galleryList() }
                  }
              }

              private fun galleryList() {
                  val perm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_IMAGES else Manifest.permission.READ_EXTERNAL_STORAGE
                  if (checkSelfPermission(perm) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(perm), 9)
                      return
                  }
                  val items = ArrayList<MI>()
                  try {
                      val uri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                      contentResolver.query(
                          uri, arrayOf(MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME),
                          null, null, MediaStore.Images.Media.DATE_ADDED + " DESC"
                      )?.use { c ->
                          var n = 0
                          while (c.moveToNext() && n < 60) {
                              val id = c.getLong(0)
                              val name = c.getString(1) ?: "image"
                              items.add(MI(name) { copyWall(ContentUris.withAppendedId(uri, id)) })
                              n++
                          }
                      }
                  } catch (e: Exception) { }
                  if (items.isEmpty()) { toast("No pictures found on this TV"); return }
                  showMenu("Pick a wallpaper", items, back = { themeMenu() }, side = true)
              }

              private fun folderWall() {
                  val f = File(getExternalFilesDir(null), "wallpaper.jpg")
                  if (f.exists()) copyWall(Uri.fromFile(f))
                  else toast("Put wallpaper.jpg in: " + (getExternalFilesDir(null)?.path ?: "Android/data/com.cine.launcher/files"))
              }

              private fun copyWall(uri: Uri) {
                  io.execute {
                      try {
                          val dm = resources.displayMetrics
                          val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                          var s = 1
                          while (o.outWidth / (s * 2) >= dm.widthPixels && o.outHeight / (s * 2) >= dm.heightPixels) s *= 2
                          val bmp = contentResolver.openInputStream(uri)?.use {
                              BitmapFactory.decodeStream(it, null, BitmapFactory.Options().apply { inSampleSize = s })
                          }
                          if (bmp == null) { runOnUiThread { toast("Couldn't read that picture") }; return@execute }
                          FileOutputStream(wallFile()).use { bmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
                          bmp.recycle()
                          runOnUiThread { store.put("wall", "1"); applyLook(); toast("Wallpaper set") }
                      } catch (e: Exception) { runOnUiThread { toast("Couldn't set the wallpaper") } }
                  }
              }

              // ---------- app list ----------
              private fun render() {
                  val hidden = store.list("hidden")
                  val rev = store.sel("sort") == 1
                  fun s(l: List<AppItem>) = if (rev) l.sortedByDescending { it.label.lowercase() } else l.sortedBy { it.label.lowercase() }
                  val vis = master.filter { it.pkg !in hidden }
                  var list = s(vis.filter { it.pkg.isNotEmpty() && isLean(it) }) + s(vis.filter { !isLean(it) })
                  val ord = store.list("order")
                  if (ord.isNotEmpty()) list = list.sortedBy { val i = ord.indexOf(it.pkg); if (i < 0) Int.MAX_VALUE else i }
                  shown = list
                  val n = intArrayOf(4, 6, 8, 10, 12)[store.sel("count")]
                  when (store.sel("layout")) {
                      0 -> {
                          aR.items = if (store.sel("toprow") == 0) store.list("recent").mapNotNull { p -> list.firstOrNull { it.pkg == p } } else emptyList()
                          a1.items = list; a2.items = emptyList()
                      }
                      1 -> { aR.items = emptyList(); a1.items = list.take(n); a2.items = list.drop(n) }
                      else -> { aR.items = emptyList(); a1.items = list; a2.items = emptyList() }
                  }
                  aR.notifyDataSetChanged(); a1.notifyDataSetChanged(); a2.notifyDataSetChanged()
                  rowR.visibility = if (aR.items.isEmpty()) View.GONE else View.VISIBLE
                  row2.visibility = if (a2.items.isEmpty()) View.GONE else View.VISIBLE
                  if (overlay == null) row1.post {
                      if (focusPending || currentFocus == null) { if (row1.getChildAt(0)?.requestFocus() == true) focusPending = false }
                  }
              }

              private val leanPkgs = HashSet<String>()
              private fun isLean(a: AppItem) = a.pkg in leanPkgs

              private fun loadApps() {
                  io.execute {
                      val pm = packageManager
                      val seen = HashSet<String>()
                      val result = ArrayList<AppItem>()
                      val lean = HashSet<String>()
                      fun add(cat: String, isLeanCat: Boolean) {
                          val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                              .filter { it.activityInfo.packageName != packageName }
                          for (ri in apps) {
                              val pkg = ri.activityInfo.packageName
                              if (!seen.add(pkg)) continue
                              val banner = ri.activityInfo.loadBanner(pm) ?: ri.activityInfo.applicationInfo.loadBanner(pm)
                              val icon = ri.loadIcon(pm)
                              val img = banner ?: icon
                              val intent = Intent(Intent.ACTION_MAIN)
                                  .setClassName(pkg, ri.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              if (isLeanCat) lean.add(pkg)
                              result.add(AppItem(ri.loadLabel(pm).toString(), pkg, intent, img, icon, banner != null, tintOf(img)))
                          }
                      }
                      add(Intent.CATEGORY_LEANBACK_LAUNCHER, true)
                      add(Intent.CATEGORY_LAUNCHER, false)
                      runOnUiThread { leanPkgs.clear(); leanPkgs.addAll(lean); master = result; render() }
                  }
              }

              private fun recordRecent(pk: String) {
                  val l = listOf(pk) + store.list("recent").filter { it != pk }
                  store.put("recent", l.take(8).joinToString(","))
              }

              private fun launchOpts(v: View?): Bundle? = try {
                  when (store.sel("aopen")) {
                      1 -> if (v != null) ActivityOptions.makeScaleUpAnimation(v, 0, 0, v.width, v.height).toBundle() else null
                      2 -> ActivityOptions.makeCustomAnimation(this, R.anim.c_fade_in, R.anim.c_fade_out).toBundle()
                      3 -> ActivityOptions.makeCustomAnimation(this, R.anim.c_slide_up_in, R.anim.c_hold).toBundle()
                      4 -> ActivityOptions.makeCustomAnimation(this, R.anim.c_slide_left_in, R.anim.c_slide_left_out).toBundle()
                      5 -> ActivityOptions.makeCustomAnimation(this, R.anim.c_zoom_in, R.anim.c_fade_out).toBundle()
                      6 -> ActivityOptions.makeCustomAnimation(this, R.anim.c_zoom_out_in, R.anim.c_fade_out).toBundle()
                      7 -> ActivityOptions.makeCustomAnimation(this, 0, 0).toBundle()
                      else -> null
                  }
              } catch (e: Exception) { null }

              private fun launchApp(a: AppItem, v: View?) {
                  try { startActivity(a.intent, launchOpts(v)); recordRecent(a.pkg) } catch (e: Exception) { toast("Can't open " + a.label) }
              }

              private fun openApp(a: AppItem, v: View?) {
                  val f = splitFirst
                  splitFirst = null
                  if (f != null && f.pkg != a.pkg) {
                      try {
                          startActivity(f.intent); recordRecent(f.pkg)
                          handler.postDelayed({
                              try {
                                  startActivity(Intent(a.intent).addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT or Intent.FLAG_ACTIVITY_MULTIPLE_TASK))
                                  recordRecent(a.pkg)
                              } catch (e: Exception) { toast("Couldn't open the second app") }
                          }, 900)
                      } catch (e: Exception) { toast("Couldn't open the first app") }
                  } else launchApp(a, v)
              }

              private fun splitSupported(): Boolean = try {
                  val id = Resources.getSystem().getIdentifier("config_supportsSplitScreenMultiWindow", "bool", "android")
                  id != 0 && Resources.getSystem().getBoolean(id)
              } catch (e: Exception) { false }

              private fun startSplit(a: AppItem) {
                  if (!splitSupported()) { toast("This TV's system doesn't support split screen"); return }
                  splitFirst = a
                  toast("Now pick the second app")
              }

              private fun saveOrder(l: List<String>) { store.put("order", l.joinToString(",")); render() }

              private fun move(pk: String, dir: Int) {
                  val l = shown.map { it.pkg }.toMutableList()
                  val i = l.indexOf(pk)
                  val j = i + dir
                  if (i < 0 || j < 0 || j >= l.size) return
                  Collections.swap(l, i, j)
                  saveOrder(l)
              }

              // ---------- menus ----------
              private fun adur(): Long = longArrayOf(150, 250, 400)[store.sel("adur")]

              private fun animIn(ov: View, panel: View) {
                  val m = store.sel("wopen")
                  if (!look.anim || m == 0) return
                  val d = adur()
                  val ip = DecelerateInterpolator()
                  ov.alpha = 0f
                  ov.animate().alpha(1f).setDuration(d).start()
                  when (m) {
                      2 -> { panel.scaleX = 0.85f; panel.scaleY = 0.85f; panel.animate().scaleX(1f).scaleY(1f).setInterpolator(ip).setDuration(d).start() }
                      3 -> { panel.translationY = dp(60).toFloat(); panel.animate().translationY(0f).setInterpolator(ip).setDuration(d).start() }
                      4 -> { panel.translationX = dp(120).toFloat(); panel.animate().translationX(0f).setInterpolator(ip).setDuration(d).start() }
                  }
              }

              private fun animOut(ov: View, panel: View?, end: () -> Unit) {
                  val m = store.sel("wclose")
                  if (!look.anim || m == 0 || panel == null) { end(); return }
                  val d = adur()
                  (ov as? ViewGroup)?.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  when (m) {
                      2 -> panel.animate().scaleX(0.85f).scaleY(0.85f).setDuration(d).start()
                      3 -> panel.animate().translationY(dp(60).toFloat()).setDuration(d).start()
                      4 -> panel.animate().translationX(dp(120).toFloat()).setDuration(d).start()
                  }
                  ov.animate().alpha(0f).setDuration(d).withEndAction { end() }.start()
              }

              private fun rowVal(mi: MI): String {
                  val t = mi.value?.invoke() ?: ""
                  return if (mi.adj != null) "\u2039  $t  \u203A" else t
              }

              private var overlayPanel: View? = null

              private fun showMenu(title: String, items: List<MI>, back: (() -> Unit)? = null, side: Boolean = false) {
                  menuBack = back
                  val old = overlay
                  if (old == null) {
                      val fb = focusBefore
                      if (fb == null || !fb.isAttachedToWindow) focusBefore = currentFocus
                  } else root.removeView(old)
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(14))
                  }
                  panel.background = TileBg(
                      panel, look.backdrop, dp(18).toFloat(), 0xFF121826.toInt(),
                      if (look.glass) 0.55f else 0.95f, look.edge, dp(1).toFloat()
                  )
                  panel.addView(TextView(this).apply {
                      text = title; setTextColor(Color.WHITE); textSize = 20f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setPadding(dp(8), 0, 0, dp(10))
                  })
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  var first: View? = null
                  for (mi in items) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(14), 0, dp(14), 0)
                          isFocusable = true
                          background = pillBg(10)
                      }
                      val l = TextView(this).apply { text = mi.label; setTextColor(Color.WHITE); textSize = 16f; maxLines = 1 }
                      val v = TextView(this).apply { text = rowVal(mi); setTextColor(0xFF9DB4FF.toInt()); textSize = 15f }
                      row.addView(l, LinearLayout.LayoutParams(0, -2, 1f))
                      row.addView(v)
                      val adj = mi.adj
                      if (adj != null) row.setOnKeyListener { _, code, ev ->
                          if (ev.action == KeyEvent.ACTION_DOWN && (code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_RIGHT)) {
                              adj(if (code == KeyEvent.KEYCODE_DPAD_LEFT) -1 else 1)
                              v.text = rowVal(mi)
                              true
                          } else false
                      }
                      row.setOnClickListener {
                          if (mi.keep) { mi.run(); v.text = rowVal(mi) } else { closeMenu(); mi.run() }
                      }
                      list.addView(row, LinearLayout.LayoutParams(-1, dp(46)))
                      if (first == null) first = row
                  }
                  val sv = ScrollView(this).apply { isVerticalScrollBarEnabled = false; addView(list) }
                  panel.addView(sv, LinearLayout.LayoutParams(-1, minOf(dp(46) * items.size, dp(340))))
                  val ov = FrameLayout(this).apply {
                      setBackgroundColor(if (side) 0x30000000 else 0xB3000000.toInt())
                      isClickable = true
                  }
                  val lp = if (side) FrameLayout.LayoutParams(dp(440), -2, Gravity.END or Gravity.CENTER_VERTICAL).apply { marginEnd = dp(40) }
                  else FrameLayout.LayoutParams(dp(440), -2, Gravity.CENTER)
                  ov.addView(panel, lp)
                  overlay = ov
                  overlayPanel = panel
                  root.addView(ov, FrameLayout.LayoutParams(-1, -1))
                  content.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  first?.requestFocus()
                  if (old == null) animIn(ov, panel)
              }

              private fun closeMenu() {
                  val ov = overlay ?: return
                  val panel = overlayPanel
                  overlay = null
                  overlayPanel = null
                  menuBack = null
                  content.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  animOut(ov, panel) {
                      root.removeView(ov)
                      if (overlay == null) {
                          val f = focusBefore
                          focusBefore = null
                          if (f != null && f.isAttachedToWindow) f.requestFocus() else row1.post { row1.getChildAt(0)?.requestFocus() }
                      }
                  }
              }

              private fun sys(action: String) {
                  try { startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
